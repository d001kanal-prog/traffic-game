<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Поток — гонка по полосам</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0d1117;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#eef2f7;user-select:none;-webkit-user-select:none}
#cv{display:block;position:fixed;inset:0;touch-action:none}
.hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 16px;pointer-events:none;z-index:5}
.hbox{background:rgba(10,14,22,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 14px;font-weight:700}
#hudScore{font-size:19px}
#hudCoins{font-size:14px;color:#ffd54a;text-align:right}
#btnPause{pointer-events:auto;margin-top:6px;border:0;border-radius:12px;background:rgba(10,14,22,.55);border:1px solid rgba(255,255,255,.15);color:#eef;font-size:16px;padding:6px 12px;cursor:pointer;backdrop-filter:blur(6px)}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;background:linear-gradient(180deg,rgba(10,14,22,.82),rgba(10,14,22,.95));backdrop-filter:blur(8px);padding:16px;overflow:hidden}
.menuInner{width:100%;max-width:400px;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 4px 26px}
h1.title{font-size:38px;letter-spacing:2px;font-weight:900;background:linear-gradient(90deg,#ffd54a,#ff8a65,#4cc9f0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{opacity:.6;font-size:13px;margin-top:-6px;letter-spacing:1px}
.coinsLine{font-size:15px;background:rgba(255,255,255,.07);padding:7px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.1)}
.coinsLine b{color:#ffd54a}
.sectionLbl{align-self:flex-start;font-size:12px;text-transform:uppercase;letter-spacing:2px;opacity:.55;margin-top:6px}
.chips{display:flex;gap:8px;width:100%;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#eef;border-radius:12px;padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer}
.chip.on{background:linear-gradient(135deg,#ffd54a,#ffb300);color:#10141c;border-color:transparent}
.garage{display:flex;flex-direction:column;gap:8px;width:100%}
.card{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:10px 12px;width:100%}
.card.sel{border-color:#ffd54a;box-shadow:0 0 0 1px #ffd54a inset}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.swatch{width:42px;height:62px;border-radius:10px;flex:none;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.swatch:after{content:'';position:absolute;left:5px;right:5px;top:34%;height:30%;background:rgba(20,35,55,.75);border-radius:5px}
.cinfo{flex:1;min-width:0}
.cname{font-weight:800;font-size:16px}
.cdesc{font-size:11.5px;opacity:.6;margin-bottom:5px}
.bar{display:flex;align-items:center;gap:6px;font-size:9.5px;opacity:.85}
.bar span{width:78px;flex:none;opacity:.6}
.bar i{display:block;height:5px;border-radius:3px;background:linear-gradient(90deg,#4cc9f0,#ffd54a)}
.bar{margin-top:2px}
.bar i{display:inline-block}
.cbtn{flex:none;border:0;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:800;cursor:pointer;background:rgba(255,255,255,.14);color:#eef;min-width:86px}
.cbtn.buy{background:linear-gradient(135deg,#ffd54a,#ffb300);color:#10141c}
.btn{border:0;border-radius:16px;padding:14px 40px;font-size:19px;font-weight:900;cursor:pointer;color:#10141c;background:linear-gradient(135deg,#ffd54a,#ffb300);box-shadow:0 6px 18px rgba(255,180,0,.3)}
.btn.secondary{background:rgba(255,255,255,.12);color:#eef;box-shadow:none;font-weight:700;font-size:15px;padding:10px 22px}
h2{font-size:30px;margin-bottom:2px}
.newRec{color:#ffd54a;font-weight:900;letter-spacing:1px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.stats{font-size:16px}.stats b{color:#ffd54a}
.dim{opacity:.55;font-size:13px}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud hidden" id="hud">
  <div class="hbox" id="hudScore">0 м</div>
  <div style="text-align:right">
    <div class="hbox" id="hudCoins">🪙 0</div>
    <button id="btnPause">⏸</button>
  </div>
</div>

<div id="menu" class="overlay">
  <div class="menuInner">
    <h1 class="title">ПОТОК</h1>
    <div class="sub">уклоняйся · собирай · покупай</div>
    <div class="coinsLine">🪙 <b id="mCoins">0</b> &nbsp;·&nbsp; Рекорд: <b id="mBest">0</b> м</div>
    <div class="sectionLbl">Трасса</div>
    <div class="chips" id="mapChips"></div>
    <div class="sectionLbl">Гараж</div>
    <div class="garage" id="garage"></div>
    <button class="btn" id="btnStart">Поехали!</button>
  </div>
</div>

<div id="over" class="overlay hidden">
  <h2>Авария!</h2>
  <div id="ovNew" class="newRec hidden">Новый рекорд!</div>
  <div class="stats">Дистанция: <b id="ovDist">0</b> м · Монеты: <b id="ovCoins">+0</b></div>
  <div class="stats dim">Рекорд: <span id="ovBest">0</span> м</div>
  <button class="btn" id="btnRetry">Ещё раз</button>
  <button class="btn secondary" id="btnGarage">В гараж</button>
</div>

<div id="pauseOv" class="overlay hidden">
  <h2>Пауза</h2>
  <button class="btn" id="btnResume">Продолжить</button>
  <button class="btn secondary" id="btnQuit">В гараж</button>
</div>

<script>
'use strict';
// ---------- утилиты ----------
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(rand(a,b+1));
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function prng(seed){let s=seed>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const TAU=Math.PI*2;

// ---------- звук ----------
const Snd={
  ctx:null,eng:null,engG:null,noiseBuf:null,
  init(){if(this.ctx)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}},
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  noise(){if(!this.noiseBuf){const c=this.ctx,b=c.createBuffer(1,c.sampleRate*0.5,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.noiseBuf=b;}return this.noiseBuf;},
  startEngine(){this.init();if(!this.ctx||this.eng)return;const c=this.ctx;this.eng=c.createOscillator();this.eng.type='sawtooth';this.eng.frequency.value=60;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=340;this.engG=c.createGain();this.engG.gain.value=0;this.eng.connect(f);f.connect(this.engG);this.engG.connect(c.destination);this.eng.start();this.engG.gain.linearRampToValueAtTime(0.045,c.currentTime+0.4);},
  setEngine(rate){if(!this.eng)return;this.eng.frequency.value=52+rate*75;this.engG.gain.value=0.03+rate*0.028;},
  stopEngine(){if(!this.eng)return;const g=this.engG,o=this.eng;try{g.gain.linearRampToValueAtTime(0,this.ctx.currentTime+0.25);}catch(e){}setTimeout(()=>{try{o.stop()}catch(e){}},320);this.eng=null;this.engG=null;},
  tone(fr,dur,type,vol,slide){if(!this.ctx)return;try{const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=fr;if(slide)o.frequency.linearRampToValueAtTime(slide,c.currentTime+dur);g.gain.value=vol||0.14;g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur);}catch(e){}},
  coin(){this.tone(880,0.08,'sine',0.11);setTimeout(()=>this.tone(1320,0.12,'sine',0.11),55);},
  gem(){this.tone(660,0.1,'triangle',0.13);setTimeout(()=>this.tone(990,0.1,'triangle',0.13),70);setTimeout(()=>this.tone(1320,0.2,'triangle',0.13),140);},
  whoosh(){if(!this.ctx)return;try{const c=this.ctx,s=c.createBufferSource();s.buffer=this.noise();const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=1.1;const g=c.createGain();g.gain.value=0.0001;g.gain.linearRampToValueAtTime(0.11,c.currentTime+0.03);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.18);s.connect(f);f.connect(g);g.connect(c.destination);s.start();s.stop(c.currentTime+0.2);}catch(e){}},
  click(){this.tone(520,0.05,'square',0.05);},
  buy(){this.tone(520,0.09,'triangle',0.12);setTimeout(()=>this.tone(784,0.18,'triangle',0.12),90);},
  crash(){if(!this.ctx)return;try{const c=this.ctx,s=c.createBufferSource();s.buffer=this.noise();const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=2200;f.frequency.linearRampToValueAtTime(120,c.currentTime+0.5);const g=c.createGain();g.gain.value=0.45;g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.6);s.connect(f);f.connect(g);g.connect(c.destination);s.start();s.stop(c.currentTime+0.6);}catch(e){}this.tone(95,0.5,'sawtooth',0.22,38);}
};

// ---------- данные ----------
const CARS=[
 {id:'city',name:'Сити',price:0,speed:1.0,hand:1.0,w:52,color:'#e63946',desc:'Надёжный седан на каждый день'},
 {id:'jeep',name:'Джип',price:120,speed:0.85,hand:1.3,w:62,color:'#2a9d8f',desc:'Тяжёлый, но очень цепкий'},
 {id:'sport',name:'Спорт',price:220,speed:1.35,hand:0.85,w:50,color:'#3a86ff',desc:'Быстрый, но норовистый'},
 {id:'cabrio',name:'Кабриолет',price:380,speed:1.15,hand:1.35,w:46,color:'#ffbe0b',desc:'Лёгкий и юркий, для манёвров'},
 {id:'super',name:'Суперкар',price:650,speed:1.55,hand:0.95,w:48,color:'#8338ec',desc:'Молния с характером'}
];
const MAPS=[
 {id:'city',name:'Город',ground:'#7a8288',road:'#3a3e44',stripe:'#f4f4f2',decor:['build','build','build','tree'],dark:false,amb:null,
  traffic:['#d62828','#f77f00','#118ab2','#06d6a0','#9b5de5','#ef476f','#e9c46a']},
 {id:'night',name:'Ночь',ground:'#101318',road:'#20232b',stripe:'#e8e2c9',decor:['build','build','lamp','build'],dark:true,amb:'#6ee7ff',
  traffic:['#f77f00','#00f5d4','#f15bb5','#fee440','#9b5de5','#4cc9f0','#ff6b6b']},
 {id:'desert',name:'Пустыня',ground:'#d9b382',road:'#4a4e54',stripe:'#f2e9de',decor:['cactus','cactus','rock','cactus'],dark:false,amb:'#e8d3a8',
  traffic:['#e63946','#219ebc','#fb8500','#8ecae6','#6a994e','#bc4749','#f4a261']},
 {id:'winter',name:'Зима',ground:'#e8eef5',road:'#555c68',stripe:'#e8e8e8',decor:['pine','pine','rock','pine'],dark:false,amb:'#ffffff',
  traffic:['#bc4749','#2a9d8f','#457b9d','#e9c46a','#6d6875','#b5179e','#e76f51']}
];
const SAVE={coins:0,owned:['city'],sel:'city',best:0,map:'city'};
try{Object.assign(SAVE,JSON.parse(localStorage.getItem('flow_save')||'{}'));}catch(e){}
if(!SAVE.owned.includes('city'))SAVE.owned.push('city');
function save(){try{localStorage.setItem('flow_save',JSON.stringify(SAVE));}catch(e){}}

// ---------- холст ----------
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,roadX=0,roadW=0,laneW=0;const LANES=4;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);roadW=Math.min(W*0.74,430);roadX=(W-roadW)/2;laneW=roadW/LANES;if(player)player.x=laneCX(player.lane);}
function laneCX(i){return roadX+laneW*(i+0.5);}
const playerY=()=>H-140;

// ---------- состояние ----------
let state='menu';
let player={lane:1,x:0,tilt:0,dead:false};
let traffic=[],coinsArr=[],parts=[],amb=[];
let dist=0,runCoins=0,scrollAcc=0,spawnT=1,coinT=1.5,shake=0,flash=0,crashScroll=0,crashT=0,tSec=0;

function getCar(){return CARS.find(c=>c.id===SAVE.sel)||CARS[0];}
function getMap(){return MAPS.find(m=>m.id===SAVE.map)||MAPS[0];}

// ---------- декорации ----------
let scen=[];
function addSideItem(side,y){
 const m=getMap();
 const type=m.decor[irand(0,m.decor.length-1)];
 scen.push({side,y,type,seed:irand(1,99999),off:rand(16,64)});
}
function seedScenery(){scen=[];for(let y=-H;y<H+280;y+=rand(70,120)){addSideItem(-1,y);addSideItem(1,y+rand(20,90));}}
function updateScenery(sc,dt){for(const it of scen){it.y+=sc*0.92*dt;if(it.y>H+280){it.y-=H+560;it.type=getMap().decor[irand(0,getMap().decor.length-1)];it.seed=irand(1,99999);it.off=rand(16,64);}}}
function initAmb(){amb=[];for(let i=0;i<26;i++)amb.push({x:rand(0,W),y:rand(0,H),r:rand(1,2.6),ph:rand(0,6)});}
function updateAmb(sc,dt){for(const a of amb){a.y+=sc*0.4*dt;a.x+=Math.sin(tSec*1.3+a.ph)*12*dt;if(a.y>H+10){a.y=-10;a.x=rand(0,W);}}}

function drawScen(it,map){
 const pr=prng(it.seed);
 if(it.type==='build'){
  const w=60+pr()*60,h=90+pr()*160;
  const x=it.side>0?roadX+roadW+it.off:roadX-it.off-w;
  const pal=map.dark?['#1c2436','#232c40','#2a3048']:['#b0bec5','#9fb3c8','#a89f91','#95a5b7'];
  const col=pal[Math.floor(pr()*pal.length)];
  ctx.fillStyle=col;ctx.fillRect(x,it.y-h,w,h);
  ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.strokeRect(x+0.5,it.y-h+0.5,w-1,h-1);
  const cols=Math.max(2,Math.floor(w/16)),rows=Math.floor(h/22);
  for(let r=0;r<rows;r++)for(let c2=0;c2<cols;c2++){
   const lit=pr();
   if(map.dark&&lit<0.45)ctx.fillStyle='rgba(255,214,102,'+(0.45+pr()*0.5)+')';
   else if(map.dark)ctx.fillStyle='rgba(40,50,80,0.9)';
   else ctx.fillStyle=lit<0.5?'rgba(185,210,230,0.9)':'rgba(120,140,160,0.9)';
   ctx.fillRect(x+6+c2*(w-12)/cols,it.y-h+8+r*22,Math.max(4,(w-12)/cols-8),12);
  }
 }else if(it.type==='lamp'){
  const x=it.side>0?roadX+roadW+6:roadX-10;
  ctx.strokeStyle='#4a5058';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(x+2,it.y);ctx.lineTo(x+2,it.y-56);ctx.lineTo(x+2+(it.side>0?-12:12),it.y-56);ctx.stroke();
  const lx=x+2+(it.side>0?-16:16);
  const g=ctx.createRadialGradient(lx,it.y-56,2,lx,it.y-56,46);
  g.addColorStop(0,'rgba(255,230,150,0.85)');g.addColorStop(1,'rgba(255,230,150,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(lx,it.y-56,46,0,TAU);ctx.fill();
 }else if(it.type==='tree'){
  const x=it.side>0?roadX+roadW+it.off:roadX-it.off-24;
  ctx.fillStyle='#5d4037';ctx.fillRect(x+9,it.y-26,6,26);
  ctx.fillStyle=map.id==='winter'?'#3f6d51':'#2e7d32';
  ctx.beginPath();ctx.arc(x+12,it.y-34,14+pr()*8,0,TAU);ctx.arc(x+6,it.y-26,10,0,TAU);ctx.arc(x+18,it.y-26,10,0,TAU);ctx.fill();
  if(map.id==='winter'){ctx.fillStyle='rgba(255,255,255,0.55)';ctx.beginPath();ctx.arc(x+12,it.y-38,8,0,TAU);ctx.fill();}
 }else if(it.type==='cactus'){
  const x=it.side>0?roadX+roadW+it.off:roadX-it.off-16;
  ctx.fillStyle='#4f9d5d';const hgt=26+pr()*26;
  rr(x,it.y-hgt,12,hgt,6);ctx.fill();
  rr(x-8,it.y-hgt*0.6,7,14,3);ctx.fill();
  rr(x+13,it.y-hgt*0.75,7,16,3);ctx.fill();
 }else if(it.type==='rock'){
  const x=it.side>0?roadX+roadW+it.off:roadX-it.off-22;
  const s=10+pr()*14;
  ctx.fillStyle=map.id==='winter'?'#dfe7ee':'#8d8378';
  ctx.beginPath();ctx.ellipse(x+s,it.y-s/2,s,s*0.7,0,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.beginPath();ctx.ellipse(x+s-3,it.y-s/2-3,s*0.6,s*0.4,0,0,TAU);ctx.fill();
 }
}

// ---------- отрисовка дороги ----------
function drawRoad(map){
 const bg=ctx.createLinearGradient(0,0,0,H);
 bg.addColorStop(0,map.ground);bg.addColorStop(1,shade(map.ground,-16));
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 ctx.fillStyle=shade(map.road,-9);ctx.fillRect(roadX-15,0,roadW+30,H);
 const rg=ctx.createLinearGradient(roadX,0,roadX+roadW,0);
 rg.addColorStop(0,shade(map.road,-6));rg.addColorStop(0.5,map.road);rg.addColorStop(1,shade(map.road,-6));
 ctx.fillStyle=rg;ctx.fillRect(roadX,0,roadW,H);
 ctx.globalAlpha=0.9;ctx.fillStyle=map.stripe;
 ctx.fillRect(roadX+4,0,4,H);ctx.fillRect(roadX+roadW-8,0,4,H);
 ctx.globalAlpha=0.5;
 const dash=46,gap=34,per=dash+gap,off=scrollAcc%per;
 for(let i=1;i<LANES;i++){const x=roadX+laneW*i-2;for(let y=-per+off;y<H;y+=per)ctx.fillRect(x,y,4,dash);}
 ctx.globalAlpha=1;
}

// ---------- отрисовка машин ----------
function drawCar(cx,cy,w,h,color,dir,night,tilt){
 ctx.save();ctx.translate(cx,cy);ctx.rotate(tilt||0);
 const hw=w/2,hh=h/2;
 ctx.fillStyle='rgba(0,0,0,0.30)';rr(-hw-3,-hh+5,w+6,h,10);ctx.fill();
 const g=ctx.createLinearGradient(-hw,0,hw,0);
 g.addColorStop(0,shade(color,-30));g.addColorStop(0.32,color);g.addColorStop(0.68,color);g.addColorStop(1,shade(color,-40));
 ctx.fillStyle=g;rr(-hw,-hh,w,h,hw*0.42);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,0.20)';rr(-hw+3,-hh+3,w-6,h*0.26,6);ctx.fill();
 const cg=ctx.createLinearGradient(-hw,0,hw,0);
 cg.addColorStop(0,'#1d2a3a');cg.addColorStop(0.5,'#3d5a80');cg.addColorStop(1,'#1d2a3a');
 ctx.fillStyle=cg;rr(-hw+4,-hh+h*0.30,w-8,h*0.34,5);ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1.5;
 ctx.beginPath();ctx.moveTo(-hw+4,-hh+h*0.47);ctx.lineTo(hw-4,-hh+h*0.47);ctx.stroke();
 ctx.fillStyle=shade(color,-25);
 ctx.fillRect(-hw-4,-hh+h*0.30,4,7);ctx.fillRect(hw,-hh+h*0.30,4,7);
 const fy=dir===1?-hh+2:hh-6;
 if(night){
  const gy=dir===1?-hh-72:hh+72;
  const lg=ctx.createRadialGradient(0,gy,4,0,gy,95);
  lg.addColorStop(0,'rgba(255,244,200,0.35)');lg.addColorStop(1,'rgba(255,244,200,0)');
  ctx.fillStyle=lg;ctx.beginPath();ctx.ellipse(0,gy,58,92,0,0,TAU);ctx.fill();
 }
 ctx.fillStyle='#fff7d6';rr(-hw+4,fy,9,4,2);ctx.fill();rr(hw-13,fy,9,4,2);ctx.fill();
 const ry=dir===1?hh-5:-hh+2;
 ctx.fillStyle='#ff4d4d';rr(-hw+4,ry,8,3.5,2);ctx.fill();rr(hw-12,ry,8,3.5,2);ctx.fill();
 if(night){
  const gy2=dir===1?hh+10:-hh-10;
  const rg2=ctx.createRadialGradient(0,gy2,1,0,gy2,14);
  rg2.addColorStop(0,'rgba(255,60,60,0.55)');rg2.addColorStop(1,'rgba(255,60,60,0)');
  ctx.fillStyle=rg2;ctx.beginPath();ctx.arc(0,gy2,14,0,TAU);ctx.fill();
 }
 ctx.restore();
}
function drawTruck(cx,cy,dark){
 const w=58,h=128;ctx.save();ctx.translate(cx,cy);
 ctx.fillStyle='rgba(0,0,0,0.3)';rr(-w/2-3,-h/2+5,w+6,h,10);ctx.fill();
 const g=ctx.createLinearGradient(-w/2,0,w/2,0);
 g.addColorStop(0,'#8b939c');g.addColorStop(0.5,'#c8cfd8');g.addColorStop(1,'#79828c');
 ctx.fillStyle=g;rr(-w/2,-h/2,w,h*0.66,6);ctx.fill();
 ctx.strokeStyle='rgba(0,0,0,0.35)';
 for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(-w/2,-h/2+i*h*0.66/4);ctx.lineTo(w/2,-h/2+i*h*0.66/4);ctx.stroke();}
 ctx.fillStyle='#d95f43';rr(-w/2+3,h/2-h*0.30,w-6,h*0.30,7);ctx.fill();
 ctx.fillStyle='#28405c';rr(-w/2+7,h/2-h*0.24,w-14,h*0.12,4);ctx.fill();
 if(dark){
  const lg=ctx.createRadialGradient(0,h/2+70,4,0,h/2+70,90);
  lg.addColorStop(0,'rgba(255,244,200,0.32)');lg.addColorStop(1,'rgba(255,244,200,0)');
  ctx.fillStyle=lg;ctx.beginPath();ctx.ellipse(0,h/2+70,54,86,0,0,TAU);ctx.fill();
 }
 ctx.fillStyle='#fff3c4';rr(-w/2+4,h/2-6,9,4,2);ctx.fill();rr(w/2-13,h/2-6,9,4,2);ctx.fill();
 ctx.fillStyle='#ff4d4d';rr(-w/2+4,-h/2+2,8,3.5,2);ctx.fill();rr(w/2-12,-h/2+2,8,3.5,2);ctx.fill();
 ctx.restore();
}
function drawCoin(c){
 const bob=Math.sin(tSec*3+c.ph)*3,cx=laneCX(c.lane),cy=c.y+bob;
 ctx.save();ctx.translate(cx,cy);
 ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,c.r+5,c.r*0.9,c.r*0.35,0,0,TAU);ctx.fill();
 if(c.gem){
  ctx.rotate(Math.sin(tSec*2+c.ph)*0.3);
  const g=ctx.createLinearGradient(0,-c.r,0,c.r);g.addColorStop(0,'#7ef9ff');g.addColorStop(1,'#1f8fff');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,-c.r);ctx.lineTo(c.r*0.8,0);ctx.lineTo(0,c.r);ctx.lineTo(-c.r*0.8,0);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=1.5;ctx.stroke();
 }else{
  const g=ctx.createRadialGradient(-c.r/3,-c.r/3,2,0,0,c.r);
  g.addColorStop(0,'#ffef9e');g.addColorStop(0.65,'#f6c33a');g.addColorStop(1,'#b57e12');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,c.r,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(120,80,10,0.6)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,c.r*0.62,0,TAU);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.85)';ctx.beginPath();ctx.arc(-c.r*0.3,-c.r*0.35,c.r*0.18,0,TAU);ctx.fill();
 }
 ctx.restore();
}

// ---------- логика ----------
function moveLane(d){
 const nt=clamp(player.lane+d,0,LANES-1);
 if(nt!==player.lane){player.lane=nt;Snd.whoosh();}
}
function resetRun(){
 traffic=[];coinsArr=[];parts=[];dist=0;runCoins=0;scrollAcc=0;spawnT=1.2;coinT=1.4;
 shake=0;flash=0;crashScroll=0;crashT=0;
 player={lane:Math.floor(LANES/2),x:laneCX(Math.floor(LANES/2)),tilt:0,dead:false};
 seedScenery();initAmb();
}
function startGame(){
 resetRun();state='play';
 menuEl.classList.add('hidden');overEl.classList.add('hidden');pauseOv.classList.add('hidden');
 hud.classList.remove('hidden');
 Snd.init();Snd.resume();Snd.startEngine();
}
function doCrash(){
 state='crash';crashScroll=250*getCar().speed;player.dead=true;
 Snd.stopEngine();Snd.crash();shake=16;flash=1;
 for(let i=0;i<48;i++)parts.push({x:player.x,y:playerY(),vx:rand(-220,220),vy:rand(-260,120),r:rand(2,5),life:rand(0.4,1.1),col:['#ff9f43','#ff5252','#ffd54a','#9e9e9e'][irand(0,3)]});
}
function showOver(){
 state='over';
 const d=Math.floor(dist);
 const isRec=d>SAVE.best;
 if(isRec)SAVE.best=d;
 save();
 document.getElementById('ovDist').textContent=d;
 document.getElementById('ovCoins').textContent='+'+runCoins;
 document.getElementById('ovBest').textContent=SAVE.best;
 document.getElementById('ovNew').style.display=isRec?'block':'none';
 hud.classList.add('hidden');
 overEl.classList.remove('hidden');
}
function pauseGame(){if(state!=='play')return;state='pause';Snd.stopEngine();pauseOv.classList.remove('hidden');}
function resumeGame(){pauseOv.classList.add('hidden');state='play';Snd.init();Snd.resume();Snd.startEngine();}
function openMenu(){state='menu';Snd.stopEngine();hud.classList.add('hidden');overEl.classList.add('hidden');pauseOv.classList.add('hidden');refreshMenu();menuEl.classList.remove('hidden');}

function update(dt){
 const car=getCar();
 const diff=Math.min(2.4,1+dist/1200);
 const sc=250*car.speed*diff;
 scrollAcc=(scrollAcc+sc*dt)%100000;
 dist+=sc*dt*0.07;
 tSec+=dt;
 updateScenery(sc,dt);updateAmb(sc,dt);
 const tx=laneCX(player.lane);
 player.x+=(tx-player.x)*Math.min(1,dt*10*car.hand);
 player.tilt=clamp((player.x-tx)/laneW,-1,1)*0.2;
 // спавн трафика
 spawnT-=dt;
 if(spawnT<=0){
  spawnT=rand(0.5,0.85)/(diff*Math.sqrt(car.speed));
  let lane=irand(0,LANES-1);
  if(traffic.some(t=>t.lane===lane&&t.y<170))lane=(lane+irand(1,LANES-1))%LANES;
  const truck=Math.random()<0.18;
  const w=truck?58:50,h=truck?128:95;
  traffic.push({lane,y:-170,truck,w,h,r:rand(0.8,1.25),color:getMap().traffic[irand(0,getMap().traffic.length-1)]});
 }
 for(let i=traffic.length-1;i>=0;i--){const t=traffic[i];t.y+=sc*t.r*dt;if(t.y>H+180)traffic.splice(i,1);}
 // монеты
 coinT-=dt;
 if(coinT<=0){coinT=rand(0.9,1.8);coinsArr.push({lane:irand(0,LANES-1),y:-40,gem:Math.random()<0.12,r:11.5,ph:rand(0,6)});}
 for(let i=coinsArr.length-1;i>=0;i--){
  const c=coinsArr[i];c.y+=sc*0.92*dt;
  const cx=laneCX(c.lane);
  if(Math.abs(cx-player.x)<38&&Math.abs(c.y-playerY())<52){
   if(c.gem){runCoins+=5;Snd.gem();SAVE.coins+=5;}else{runCoins+=1;Snd.coin();SAVE.coins+=1;}
   for(let k=0;k<10;k++)parts.push({x:cx,y:c.y,vx:rand(-60,60),vy:rand(-90,20),r:rand(1.5,3.5),life:rand(0.3,0.6),col:c.gem?'#7ef9ff':'#ffd54a'});
   coinsArr.splice(i,1);continue;
  }
  if(c.y>H+40)coinsArr.splice(i,1);
 }
 // частицы
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=150*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1);}
 if(shake>0)shake=Math.max(0,shake-dt*26);
 if(flash>0)flash=Math.max(0,flash-dt*2);
 Snd.setEngine(clamp((car.speed*diff-0.8)/1.6,0.1,1));
 // столкновения
 const pw=car.w,ph=car.w*1.9,py=playerY(),mrg=7;
 for(const t of traffic){
  const txp=laneCX(t.lane);
  if(Math.abs(txp-player.x)<(pw+t.w)/2-mrg&&Math.abs(t.y-py)<(ph+t.h)/2-mrg){doCrash();break;}
 }
 hudScore.textContent=Math.floor(dist)+' м';
 hudCoins.textContent='🪙 '+SAVE.coins+'  (+'+runCoins+')';
}
function updateCrash(dt){
 tSec+=dt;
 updateScenery(crashScroll,dt);updateAmb(crashScroll,dt);
 crashScroll*=0.94;
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=150*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1);}
 if(shake>0)shake=Math.max(0,shake-dt*22);
 if(flash>0)flash=Math.max(0,flash-dt*1.6);
 crashT+=dt;
 if(crashT>1.05)showOver();
}

// ---------- отрисовка кадра ----------
function draw(){
 const map=getMap(),car=getCar();
 ctx.save();
 if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));
 drawRoad(map);
 for(const it of scen)drawScen(it,map);
 if(map.amb){ctx.fillStyle=map.amb;for(const a of amb){ctx.globalAlpha=map.id==='winter'?0.5:0.14;ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,TAU);ctx.fill();}ctx.globalAlpha=1;}
 for(const c of coinsArr)drawCoin(c);
 for(const t of traffic){
  const txp=laneCX(t.lane);
  if(t.truck)drawTruck(txp,t.y,map.dark);
  else drawCar(txp,t.y,t.w,t.h,t.color,-1,map.dark,0);
 }
 if(!player.dead)drawCar(player.x,playerY(),car.w,car.w*1.9,car.color,1,map.dark,player.tilt);
 for(const p of parts){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();}
 ctx.globalAlpha=1;
 // скоростные линии
 const diff=Math.min(2.4,1+dist/1200);
 if(state==='play'&&diff>1.4){
  const a=clamp((diff-1.4),0,1)*0.22;
  ctx.strokeStyle='rgba(255,255,255,'+a+')';ctx.lineWidth=2;
  for(let i=0;i<6;i++){
   const x=roadX+((i*97+Math.floor(scrollAcc/7)*13)%roadW);
   const y=(scrollAcc*3+i*137)%H;
   ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-70);ctx.stroke();
  }
 }
 ctx.restore();
 if(flash>0){ctx.fillStyle='rgba(255,80,40,'+(flash*0.5)+')';ctx.fillRect(0,0,W,H);}
 if(map.dark){
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.9);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,22,0.45)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 }
}

// ---------- интерфейс ----------
const menuEl=document.getElementById('menu'),overEl=document.getElementById('over'),pauseOv=document.getElementById('pauseOv'),hud=document.getElementById('hud');
const hudScore=document.getElementById('hudScore'),hudCoins=document.getElementById('hudCoins');
const chips=document.getElementById('mapChips'),garage=document.getElementById('garage');
function buildChips(){
 chips.innerHTML='';
 MAPS.forEach(m=>{
  const b=document.createElement('button');
  b.className='chip'+(SAVE.map===m.id?' on':'');
  b.textContent=m.name;
  b.onclick=()=>{SAVE.map=m.id;save();Snd.init();Snd.resume();Snd.click();seedScenery();buildChips();};
  chips.appendChild(b);
 });
}
function buildGarage(){
 garage.innerHTML='';
 CARS.forEach(c=>{
  const owned=SAVE.owned.includes(c.id),sel=SAVE.sel===c.id;
  const el=document.createElement('div');
  el.className='card'+(sel?' sel':'');
  const sp=Math.round(clamp((c.speed-0.75)/0.85,0,1)*100);
  const hd=Math.round(clamp((c.hand-0.75)/0.65,0,1)*100);
  el.innerHTML='<div class="swatch" style="background:linear-gradient(135deg,'+shade(c.color,40)+','+c.color+' 55%,'+shade(c.color,-45)+')"></div>'
   +'<div class="cinfo"><div class="cname">'+c.name+'</div><div class="cdesc">'+c.desc+'</div>'
   +'<div class="bar"><span>Скорость</span><i style="width:'+sp+'%"></i></div>'
   +'<div class="bar"><span>Управление</span><i style="width:'+hd+'%"></i></div></div>'
   +'<button class="cbtn'+(owned?'':' buy')+'">'+(owned?(sel?'✓ В деле':'Выбрать'):'🪙 '+c.price)+'</button>';
  el.querySelector('.cbtn').onclick=()=>{
   Snd.init();Snd.resume();
   if(owned){SAVE.sel=c.id;save();Snd.click();buildGarage();}
   else if(SAVE.coins>=c.price){SAVE.coins-=c.price;SAVE.owned.push(c.id);SAVE.sel=c.id;save();Snd.buy();buildGarage();}
   else{el.style.animation='shake .4s';Snd.click();setTimeout(()=>{el.style.animation='';},450);}
  };
  garage.appendChild(el);
 });
}
function refreshMenu(){
 document.getElementById('mCoins').textContent=SAVE.coins;
 document.getElementById('mBest').textContent=SAVE.best;
 buildChips();buildGarage();seedScenery();initAmb();
}

// ---------- ввод ----------
cv.addEventListener('pointerdown',e=>{
 if(state!=='play')return;
 Snd.resume();
 if(e.clientX<W/2)moveLane(-1);else moveLane(1);
});
window.addEventListener('keydown',e=>{
 if(state==='play'){if(e.key==='ArrowLeft')moveLane(-1);if(e.key==='ArrowRight')moveLane(1);}
 if(e.key==='Escape'&&state==='play')pauseGame();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseGame();});

document.getElementById('btnStart').onclick=()=>{Snd.init();Snd.resume();Snd.click();startGame();};
document.getElementById('btnRetry').onclick=()=>{Snd.click();startGame();};
document.getElementById('btnGarage').onclick=()=>{Snd.click();openMenu();};
document.getElementById('btnResume').onclick=()=>{Snd.click();resumeGame();};
document.getElementById('btnQuit').onclick=()=>{Snd.click();openMenu();};
document.getElementById('btnPause').onclick=()=>{if(state==='play')pauseGame();};

// ---------- цикл ----------
let last=0;
function frame(t){
 requestAnimationFrame(frame);
 const dt=Math.min(0.05,(t-last)/1000||0.016);last=t;
 if(state==='play')update(dt);
 else if(state==='crash')updateCrash(dt);
 else{tSec+=dt;const sc=140;scrollAcc=(scrollAcc+sc*dt)%100000;updateScenery(sc,dt);updateAmb(sc,dt);}
 draw();
}
window.addEventListener('resize',resize);
resize();
refreshMenu();
requestAnimationFrame(frame);
</script>
</body>
