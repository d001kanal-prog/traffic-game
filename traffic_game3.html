<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Машина в потоке</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  canvas{display:block;position:fixed;top:0;left:0;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
'use strict';
/* ================= безопасная обёртка хранилища =================
   В Telegram localStorage иногда запрещён — любое обращение к нему
   без try/catch роняло скрипт и игра зависала. Теперь всё безопасно. */
var _mem = {};
function sGet(k){ try{ return localStorage.getItem(k); }catch(e){ return _mem[k]!==undefined?_mem[k]:null; } }
function sSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} _mem[k]=v; }

/* Telegram */
var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
try{ if(tg){ tg.ready(); tg.expand(); } }catch(e){}
try{ if(tg && tg.requestFullscreen){ tg.requestFullscreen(); } }catch(e){}

/* ================= сохранение ================= */
var SAVE = { coins:0, owned:{c0:true}, sel:'c0', best:0, map:0, sound:true };
function loadSave(){
  var raw = sGet('traffic_save_v3');
  if(raw){ try{ var d = JSON.parse(raw); for(var k in d) SAVE[k]=d[k]; }catch(e){} }
  /* облачное хранилище Telegram — подтягиваем асинхронно, не блокируя старт */
  if(tg && tg.CloudStorage){
    try{
      tg.CloudStorage.getItem('traffic_save_v3', function(err, val){
        if(!err && val){
          try{
            var d = JSON.parse(val);
            SAVE.coins = Math.max(SAVE.coins, d.coins||0);
            SAVE.best  = Math.max(SAVE.best,  d.best ||0);
            for(var k in (d.owned||{})) SAVE.owned[k]=true;
            if(d.owned && d.owned[d.sel]) SAVE.sel = d.sel;
          }catch(e){}
        }
      });
    }catch(e){}
  }
}
function persist(){
  var raw = JSON.stringify(SAVE);
  sSet('traffic_save_v3', raw);
  if(tg && tg.CloudStorage){
    try{ tg.CloudStorage.setItem('traffic_save_v3', raw, function(){}); }catch(e){}
  }
}
loadSave();

/* ================= звук ================= */
var AC=null, master=null, motorOsc=null, motorGain=null, soundOn = SAVE.sound!==false;
function audioInit(){
  if(AC) return;
  try{
    var Ctor = window.AudioContext||window.webkitAudioContext;
    if(!Ctor) return;
    AC = new Ctor();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
  }catch(e){ AC=null; }
}
function beep(freq, dur, type, vol, when){
  if(!AC||!soundOn) return;
  try{
    var o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.2, AC.currentTime+(when||0));
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+(when||0)+dur);
    o.connect(g); g.connect(master);
    o.start(AC.currentTime+(when||0)); o.stop(AC.currentTime+(when||0)+dur+0.02);
  }catch(e){}
}
function sCoin(){ beep(880,0.08,'square',0.15); beep(1320,0.1,'square',0.15,0.06); }
function sGem(){ beep(660,0.1,'triangle',0.2); beep(880,0.1,'triangle',0.2,0.07); beep(1100,0.15,'triangle',0.2,0.14); }
function sSwipe(){ beep(300,0.06,'sine',0.1); beep(500,0.05,'sine',0.08,0.03); }
function sClick(){ beep(600,0.05,'sine',0.12); }
function sBuy(){ beep(523,0.1,'triangle',0.2); beep(659,0.1,'triangle',0.2,0.09); beep(784,0.2,'triangle',0.2,0.18); }
function sCrash(){
  if(!AC||!soundOn) return;
  try{
    var len=AC.sampleRate*0.5, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    var src=AC.createBufferSource(); src.buffer=buf;
    var g=AC.createGain(); g.gain.value=0.5;
    src.connect(g); g.connect(master); src.start();
  }catch(e){}
  beep(80,0.4,'sawtooth',0.3);
}
function motorStart(){
  if(!AC||motorOsc) return;
  try{
    motorOsc=AC.createOscillator(); motorGain=AC.createGain();
    motorOsc.type='sawtooth'; motorOsc.frequency.value=60;
    motorGain.gain.value=0;
    motorOsc.connect(motorGain); motorGain.connect(master);
    motorOsc.start();
  }catch(e){ motorOsc=null; }
}
function motorStop(){ try{ if(motorGain) motorGain.gain.value=0; }catch(e){} }

/* ================= канвас ================= */
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();
window.addEventListener('resize', resize);

/* ================= данные ================= */
var CARS = [
  {id:'c0', name:'Сити',      price:0,    speed:1.00, hand:1.00, wid:1.00, col:'#e74c3c', col2:'#c0392b'},
  {id:'c1', name:'Джип',      price:120,  speed:0.90, hand:1.35, wid:1.15, col:'#27ae60', col2:'#1e8449'},
  {id:'c2', name:'Спорт',     price:300,  speed:1.25, hand:0.80, wid:0.95, col:'#2980f5', col2:'#1f6dd0'},
  {id:'c3', name:'Кабриолет', price:550,  speed:1.10, hand:1.20, wid:0.90, col:'#f39c12', col2:'#d68910'},
  {id:'c4', name:'Суперкар',  price:1000, speed:1.50, hand:0.65, wid:0.90, col:'#8e44ad', col2:'#6c3483'}
];
var MAPS = [
  {name:'Город',  sky:'#7ec8e3', road:'#3a3f4a', line:'#f1c40f', side:'#95a5a6', decor:'city',  traffic:['#e67e22','#9b59b6','#16a085','#2c3e50','#c0392b']},
  {name:'Ночь',   sky:'#1a1a2e', road:'#23262e', line:'#f5d76e', side:'#2c2f3a', decor:'night', traffic:['#34495e','#7f8c8d','#e74c3c','#d4ac0d','#5d6d7e']},
  {name:'Пустыня',sky:'#f5cba0', road:'#4d4a42', line:'#f9e79f', side:'#d4b483', decor:'desert',traffic:['#a93226','#7d6608','#1a5276','#6e2c00','#5b2c6f']},
  {name:'Зима',   sky:'#d6eaf8', road:'#5d6d7e', line:'#fdfefe', side:'#eaf2f8', decor:'winter',traffic:['#c0392b','#1f618d','#196f3d','#7d3c98','#b7950b']}
];
var LANES = 4;

/* ================= состояние игры ================= */
var state='menu';
var G = null; /* данные текущего заезда */
var shake=0, flash=0;
var particles=[];
var coinsRun=0, score=0;
var tPrev=0;

function newGame(){
  var car = CARS.find(c=>c.id===SAVE.sel)||CARS[0];
  G = {
    lane: Math.floor(LANES/2), x:0, tx:0,
    speed: 180, baseSpeed: 180*car.speed,
    cars: [], items: [], spawnT:0, itemT:0,
    dist:0, dead:false, deadT:0,
    car: car, laneW:0, roadX:0, roadW:0,
    decor: [], stars: null
  };
  coinsRun=0; score=0; particles=[];
  layout();
}
function layout(){
  G.roadW = Math.min(W*0.72, 460);
  G.roadX = (W-G.roadW)/2;
  G.laneW = G.roadW/LANES;
  G.x = laneX(G.lane); G.tx = G.x;
  G.decor = [];
  for(var i=0;i<14;i++) G.decor.push({x: (Math.random()<0.5? G.roadX*0.45 : W-G.roadX*0.55) + Math.random()*40, y: Math.random()*H, s: 0.7+Math.random()*0.7});
}
function laneX(l){ return G.roadX + G.laneW*(l+0.5); }

/* ================= ввод ================= */
function onTap(px,py){
  audioInit();
  if(AC && AC.state==='suspended'){ try{AC.resume();}catch(e){} }
  if(state==='play' && !G.dead){
    var mid = W/2;
    if(px<mid) move(-1); else move(1);
  }
}
function move(dir){
  var nl = G.lane+dir;
  if(nl<0||nl>=LANES) return;
  G.lane=nl; G.tx=laneX(nl); sSwipe();
}
function pointer(e){
  if(e.changedTouches){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      onTap(t.clientX, t.clientY);
    }
  } else onTap(e.clientX, e.clientY);
  e.preventDefault();
}
cv.addEventListener('touchstart', pointer, {passive:false});
cv.addEventListener('mousedown', pointer);

/* кнопки меню: [x,y,w,h,label,action] */
var buttons=[];
function btn(x,y,w,h,label,action){ buttons.push({x:x,y:y,w:w,h:h,label:label,action:action}); }

function hitButton(px,py){
  for(var i=0;i<buttons.length;i++){
    var b=buttons[i];
    if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h){ sClick(); return b; }
  }
  return null;
}
function uiTap(px,py){
  var b = hitButton(px,py);
  if(b){ b.action(); return true; }
  return false;
}

document.addEventListener('visibilitychange', function(){
  if(document.hidden && state==='play' && !G.dead){ state='pause'; motorStop(); }
});
window.addEventListener('keydown', function(e){
  audioInit();
  if(state==='play'&&!G.dead){
    if(e.key==='ArrowLeft'||e.key==='a') move(-1);
    if(e.key==='ArrowRight'||e.key==='d') move(1);
    if(e.key==='Escape') state='pause';
  }
});

/* ================= рисование машин ================= */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawCar(x,y,w,h,col,col2,facing,night){
  /* тень */
  ctx.fillStyle='rgba(0,0,0,0.35)';
  rr(x-w/2+3, y-h/2+5, w, h, w*0.22); ctx.fill();
  /* кузов */
  var g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);
  g.addColorStop(0,col2); g.addColorStop(0.35,col); g.addColorStop(0.65,col); g.addColorStop(1,col2);
  ctx.fillStyle=g;
  rr(x-w/2, y-h/2, w, h, w*0.22); ctx.fill();
  /* крыша/стекло */
  ctx.fillStyle='rgba(20,30,45,0.85)';
  rr(x-w*0.32, y-h*0.28, w*0.64, h*0.42, w*0.12); ctx.fill();
  /* блик */
  ctx.fillStyle='rgba(255,255,255,0.18)';
  rr(x-w*0.30, y-h*0.24, w*0.16, h*0.36, w*0.06); ctx.fill();
  /* зеркала */
  ctx.fillStyle=col2;
  ctx.fillRect(x-w/2-3, y-h*0.18, 4, h*0.12);
  ctx.fillRect(x+w/2-1, y-h*0.18, 4, h*0.12);
  /* фары и стопы */
  var hy = facing==='up' ? y-h/2 : y+h/2;
  var ty = facing==='up' ? y+h/2 : y-h/2;
  if(night){
    ctx.save();
    var cone = facing==='up' ? {x1:x-w*0.2,y1:hy,x2:x-w*0.45,y2:hy+(facing==='up'?-90:90)} : null;
    ctx.fillStyle='rgba(255,240,180,0.12)';
    ctx.beginPath();
    if(facing==='up'){ ctx.moveTo(x-w*0.25,hy); ctx.lineTo(x-w*0.55,hy-90); ctx.lineTo(x+w*0.55,hy-90); ctx.lineTo(x+w*0.25,hy); }
    else { ctx.moveTo(x-w*0.25,hy); ctx.lineTo(x-w*0.55,hy+90); ctx.lineTo(x+w*0.55,hy+90); ctx.lineTo(x+w*0.25,hy); }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = night ? '#fff6c8' : '#ffeaa7';
  ctx.fillRect(x-w*0.36, hy-(facing==='up'?5:1), w*0.16, 5);
  ctx.fillRect(x+w*0.20, hy-(facing==='up'?5:1), w*0.16, 5);
  ctx.fillStyle = '#ff5b5b';
  ctx.fillRect(x-w*0.36, ty-(facing==='up'?0:5), w*0.16, 5);
  ctx.fillRect(x+w*0.20, ty-(facing==='up'?0:5), w*0.16, 5);
}

/* ================= декор ================= */
function drawDecor(d, map){
  var x=d.x, y=(d.y - G.dist*0.3) % (H+120); if(y<-120) y+=H+120;
  ctx.save();
  if(map.decor==='city'||map.decor==='night'){
    var bw=34*d.s, bh=70*d.s;
    ctx.fillStyle = map.decor==='night' ? '#1f2333' : '#b2babb';
    ctx.fillRect(x-bw/2, y-bh, bw, bh);
    if(map.decor==='night'){
      for(var r=0;r<4;r++)for(var c=0;c<2;c++){
        if((r*2+c+Math.floor(d.x))%3!==0) continue;
        ctx.fillStyle='rgba(255,220,120,0.8)';
        ctx.fillRect(x-bw/2+5+c*14, y-bh+8+r*16, 7, 9);
      }
      ctx.fillStyle='rgba(255,220,120,0.08)';
      ctx.beginPath(); ctx.arc(x,y-bh/2,bh*0.9,0,7); ctx.fill();
    }
  } else if(map.decor==='desert'){
    ctx.strokeStyle='#2e7d32'; ctx.lineWidth=5*d.s; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-26*d.s);
    ctx.moveTo(x,y-16*d.s); ctx.lineTo(x-9*d.s,y-24*d.s);
    ctx.moveTo(x,y-20*d.s); ctx.lineTo(x+9*d.s,y-30*d.s);
    ctx.stroke();
  } else {
    ctx.fillStyle='#6d4c41'; ctx.fillRect(x-3*d.s,y-20*d.s,6*d.s,20*d.s);
    ctx.fillStyle='#1e8449';
    ctx.beginPath(); ctx.arc(x,y-30*d.s,14*d.s,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(x-4*d.s,y-34*d.s,5*d.s,0,7); ctx.fill();
  }
  ctx.restore();
}

/* ================= логика ================= */
function update(dt){
  if(state!=='play') return;
  if(G.dead){ G.deadT+=dt; if(G.deadT>1.2) endRun(); return; }

  G.speed = Math.min(G.baseSpeed*(1+G.dist/9000), G.baseSpeed*2.2);
  G.dist += G.speed*dt;
  score = Math.floor(G.dist/10);

  /* перестроение */
  G.x += (G.tx-G.x)*Math.min(1, dt*10*(G.car.hand));

  /* спавн машин */
  G.spawnT -= dt;
  if(G.spawnT<=0){
    G.spawnT = Math.max(0.35, 0.9 - G.dist/12000) * (0.7+Math.random()*0.6);
    var lane = Math.floor(Math.random()*LANES);
    var tc = MAPS[SAVE.map].traffic[Math.floor(Math.random()*MAPS[SAVE.map].traffic.length)];
    G.cars.push({lane:lane, x:laneX(lane), y:-90, w:G.laneW*0.6, h:G.laneW*1.15, col:tc, rel: 0.4+Math.random()*0.5, wob:Math.random()*6.28});
    /* иногда вторая машина рядом — «стена» с проёмом */
    if(Math.random()<0.3){
      var l2=(lane+ (Math.random()<0.5?1:3))%LANES;
      if(Math.random()<0.5) l2 = Math.min(LANES-1, lane+1);
      if(l2!==lane) G.cars.push({lane:l2, x:laneX(l2), y:-90-Math.random()*60, w:G.laneW*0.6, h:G.laneW*1.15, col:MAPS[SAVE.map].traffic[Math.floor(Math.random()*MAPS[SAVE.map].traffic.length)], rel:0.4+Math.random()*0.5, wob:0});
    }
  }
  /* спавн монет/самоцветов */
  G.itemT -= dt;
  if(G.itemT<=0){
    G.itemT = 1.2+Math.random()*1.6;
    var il=Math.floor(Math.random()*LANES);
    G.items.push({x:laneX(il), y:-40, gem: Math.random()<0.12, ph:Math.random()*6.28});
  }

  /* движение машин потока */
  var pw = G.laneW*0.6*G.car.wid, ph = pw*1.9;
  for(var i=G.cars.length-1;i>=0;i--){
    var c=G.cars[i];
    c.y += (G.speed - c.rel*140)*dt;
    if(c.y>H+120){ G.cars.splice(i,1); continue; }
    /* столкновение */
    var dy=Math.abs(c.y-(H-140)), dx=Math.abs(c.x-G.x);
    if(dy < (c.h+ph)/2*0.82 && dx < (c.w+pw)/2*0.85){ crash(c); return; }
  }
  /* монеты */
  for(var j=G.items.length-1;j>=0;j--){
    var it=G.items[j];
    it.y += G.speed*dt;
    if(it.y>H+60){ G.items.splice(j,1); continue; }
    if(Math.abs(it.y-(H-140))<ph*0.6 && Math.abs(it.x-G.x)<pw*0.8){
      if(it.gem){ SAVE.coins+=5; coinsRun+=5; sGem(); } else { SAVE.coins++; coinsRun++; sCoin(); }
      persistSoon();
      G.items.splice(j,1);
    }
  }
  /* частицы */
  for(var k=particles.length-1;k>=0;k--){
    var p=particles[k];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
    if(p.life<=0) particles.splice(k,1);
  }
  if(shake>0) shake=Math.max(0,shake-dt*3);
  if(flash>0) flash=Math.max(0,flash-dt*2.5);

  /* звук мотора */
  if(AC && motorGain){
    try{
      motorGain.gain.value = soundOn?0.05:0;
      motorOsc.frequency.value = 55 + G.speed*0.35;
    }catch(e){}
  }
}
function crash(c){
  G.dead=true; sCrash(); shake=1; flash=1;
  try{ if(tg&&tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy'); }catch(e){}
  motorStop();
  for(var i=0;i<40;i++){
    particles.push({x:G.x,y:H-140,vx:(Math.random()*2-1)*260,vy:(Math.random()*2-1)*260,life:0.5+Math.random()*0.5,
      col:['#f39c12','#e74c3c','#f7dc6f','#7f8c8d'][Math.floor(Math.random()*4)]});
  }
}
function endRun(){
  SAVE.best = Math.max(SAVE.best, score);
  persist();
  state='over';
}

var persistTimer=null;
function persistSoon(){
  if(persistTimer) return;
  persistTimer=setTimeout(function(){ persistTimer=null; persist(); }, 800);
}

/* ================= отрисовка ================= */
function drawMapBg(map){
  ctx.fillStyle=map.sky; ctx.fillRect(0,0,W,H);
  if(map.decor==='night'){
    ctx.fillStyle='#fff';
    for(var i=0;i<40;i++){
      var sx=(i*137)%W, sy=(i*79)%H;
      ctx.globalAlpha=0.4+0.6*Math.abs(Math.sin(i+performance.now()/1000));
      ctx.fillRect(sx,sy,2,2);
    }
    ctx.globalAlpha=1;
  }
  /* дорога */
  ctx.fillStyle=map.road; ctx.fillRect(G.roadX,0,G.roadW,H);
  /* обочина */
  ctx.fillStyle=map.side;
  ctx.fillRect(0,0,G.roadX,H); ctx.fillRect(G.roadX+G.roadW,0,W-G.roadX-G.roadW,H);
  /* разметка */
  ctx.strokeStyle=map.line; ctx.lineWidth=4; ctx.setLineDash([34,26]);
  ctx.lineDashOffset = -G.dist % 60;
  for(var l=1;l<LANES;l++){
    ctx.beginPath();
    ctx.moveTo(G.roadX+G.laneW*l,0); ctx.lineTo(G.roadX+G.laneW*l,H);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  /* края дороги */
  ctx.fillStyle='#ecf0f1';
  ctx.fillRect(G.roadX-6,0,6,H); ctx.fillRect(G.roadX+G.roadW,0,6,H);
  for(var d2=0;d2<G.decor.length;d2++) drawDecor(G.decor[d2], map);
}

function drawGame(map){
  drawMapBg(map);
  /* монеты и самоцветы */
  for(var j=0;j<G.items.length;j++){
    var it=G.items[j];
    var s = 1+0.15*Math.sin(performance.now()/150+it.ph);
    if(it.gem){
      ctx.save(); ctx.translate(it.x,it.y); ctx.scale(s,s); ctx.rotate(0.4);
      ctx.fillStyle='#5dade2'; ctx.strokeStyle='#2e86c1'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(0,-11); ctx.lineTo(9,0); ctx.lineTo(0,11); ctx.lineTo(-9,0); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(4,-1); ctx.lineTo(-4,-1); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else {
      ctx.save(); ctx.translate(it.x,it.y); ctx.scale(s,s);
      ctx.fillStyle='#f1c40f'; ctx.strokeStyle='#b7950b'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,0,10,0,7); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#b7950b'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('$',0,1); ctx.restore();
    }
  }
  /* машины потока */
  for(var i=0;i<G.cars.length;i++){
    var c=G.cars[i];
    drawCar(c.x, c.y, c.w, c.h, c.col, shade(c.col), 'down', map.decor==='night');
  }
  /* машина игрока */
  var pw=G.laneW*0.6*G.car.wid, ph=pw*1.9;
  if(!G.dead || G.deadT<0.1){
    drawCar(G.x, H-140, pw, ph, G.car.col, G.car.col2, 'up', map.decor==='night');
  }
  /* частицы */
  for(var k=0;k<particles.length;k++){
    var p=particles[k];
    ctx.globalAlpha=Math.max(0,p.life*2);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-3,p.y-3,6,6);
  }
  ctx.globalAlpha=1;
  /* скоростные линии */
  if(G.speed>G.baseSpeed*1.4){
    ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=2;
    for(var s2=0;s2<8;s2++){
      var lx=G.roadX+((s2*97)%(G.roadW)), ly=((s2*211)+performance.now()%(H));
      ctx.beginPath(); ctx.moveTo(lx,(ly*3)%H); ctx.lineTo(lx,(ly*3)%H+40); ctx.stroke();
    }
  }
  /* HUD */
  ctx.fillStyle='rgba(0,0,0,0.45)'; rr(10,10,120,34,10); ctx.fill();
  ctx.fillStyle='#f1c40f'; ctx.font='bold 18px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('$ '+SAVE.coins, 22, 27);
  ctx.fillStyle='rgba(0,0,0,0.45)'; rr(W-130,10,120,34,10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.textAlign='right';
  ctx.fillText(score+' м', W-22, 27);
  ctx.fillStyle='rgba(0,0,0,0.35)'; rr(W/2-50,10,100,30,10); ctx.fill();
  ctx.fillStyle='#ecf0f1'; ctx.textAlign='center'; ctx.font='14px sans-serif';
  ctx.fillText(map.name+' · рекорд '+SAVE.best, W/2, 25);
}
function shade(hex){
  var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return 'rgb('+Math.max(0,r-40)+','+Math.max(0,g-40)+','+Math.max(0,b-40)+')';
}

/* ================= экраны ================= */
function clearBtns(){ buttons=[]; }
function drawBtn(b, color){
  ctx.fillStyle=color||'#2980f5';
  rr(b.x,b.y,b.w,b.h,14); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 20px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(b.label, b.x+b.w/2, b.y+b.h/2);
}
function drawMenu(){
  clearBtns();
  ctx.fillStyle='#16213e'; ctx.fillRect(0,0,W,H);
  /* фары декоративной машины */
  ctx.fillStyle='#0f3460'; ctx.fillRect(0,0,W,H*0.12);
  ctx.fillStyle='#e94560'; ctx.font='bold 34px sans-serif'; ctx.textAlign='center';
  ctx.fillText('МАШИНА В ПОТОКЕ', W/2, H*0.2);
  ctx.fillStyle='#a8b3d1'; ctx.font='16px sans-serif';
  ctx.fillText('Не врезайся. Собирай монеты.', W/2, H*0.2+30);
  var bw=Math.min(260,W-60), bx=(W-bw)/2;
  btn(bx,H*0.42,bw,56,'Играть', function(){ newGame(); state='play'; motorStart(); });
  btn(bx,H*0.42+72,bw,56,'Гараж', function(){ state='garage'; });
  btn(bx,H*0.42+144,bw,56,'Трассы', function(){ state='maps'; });
  var sb = {x:W-56,y:H-56,w:40,h:40,label: soundOn?'🔊':'🔇'};
  buttons.push({x:sb.x,y:sb.y,w:sb.w,h:sb.h,action:function(){ soundOn=!soundOn; SAVE.sound=soundOn; persist(); }});
  ctx.fillStyle='#34495e'; rr(sb.x,sb.y,sb.w,sb.h,10); ctx.fill();
  ctx.font='20px sans-serif'; ctx.fillText(sb.label, sb.x+sb.w/2, sb.y+sb.h/2+1);
  ctx.fillStyle='#f1c40f'; ctx.font='bold 16px sans-serif';
  ctx.fillText('Рекорд: '+SAVE.best+' м   ·   Монет: '+SAVE.coins, W/2, H-70);
  drawButtons();
}
function drawButtons(){ for(var i=0;i<buttons.length;i++){ if(buttons[i].label) drawBtn(buttons[i], buttons[i].col); } }

var garagePage=0;
function drawGarage(){
  clearBtns();
  ctx.fillStyle='#16213e'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff'; ctx.font='bold 26px sans-serif'; ctx.textAlign='center';
  ctx.fillText('ГАРАЖ', W/2, 46);
  ctx.fillStyle='#f1c40f'; ctx.font='bold 18px sans-serif';
  ctx.fillText('Монет: '+SAVE.coins, W/2, 76);
  var cw=Math.min(150,(W-40)/2-10), ch=190, gap=14;
  var cols = Math.floor((W-30)/(cw+gap));
  for(var i=0;i<CARS.length;i++){
    var c=CARS[i];
    var col=i%cols, row=Math.floor(i/cols);
    var x=15+col*(cw+gap), y=100+row*(ch+gap);
    if(y>H-70) break;
    var owned=!!SAVE.owned[c.id], sel=SAVE.sel===c.id;
    ctx.fillStyle = sel?'#1e4d8c':'#233255';
    rr(x,y,cw,ch,14); ctx.fill();
    drawCar(x+cw/2, y+52, cw*0.4*c.wid, cw*0.76*c.wid, c.col, c.col2, 'up', false);
    ctx.fillStyle='#fff'; ctx.font='bold 16px sans-serif';
    ctx.fillText(c.name, x+cw/2, y+104);
    ctx.font='11px sans-serif'; ctx.fillStyle='#a8b3d1';
    ctx.fillText('Скорость', x+14, y+126);
    bar(x+14,y+132,cw-28,c.speed/1.5,'#e74c3c');
    ctx.fillText('Управл.', x+14, y+150);
    bar(x+14,y+156,cw-28,c.hand/1.4,'#2ecc71');
    if(!owned){
      btn(x+14,y+ch-36,cw-28,28,'$ '+c.price, function(cc){ return function(){
        if(SAVE.coins>=cc.price){ SAVE.coins-=cc.price; SAVE.owned[cc.id]=true; SAVE.sel=cc.id; persist(); sBuy(); }
        else beep(200,0.2,'sine',0.2);
      };}(c), '#27ae60');
    } else if(!sel){
      btn(x+14,y+ch-36,cw-28,28,'Выбрать', function(cc){ return function(){ SAVE.sel=cc.id; persist(); sClick(); };}(c), '#2980f5');
    } else {
      ctx.fillStyle='#2ecc71'; rr(x+14,y+ch-36,cw-28,28,8); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='bold 14px sans-serif'; ctx.fillText('Выбрана', x+cw/2, y+ch-22);
    }
  }
  drawButtons();
  var back={x:15,y:H-58,w:110,h:44,label:'← Назад'};
  buttons.push({x:back.x,y:back.y,w:back.w,h:back.h,action:function(){ state='menu'; }});
  drawBtn(back,'#34495e');
}
function bar(x,y,w,t,col){
  ctx.fillStyle='#1a2a4a'; rr(x,y,w,8,4); ctx.fill();
  ctx.fillStyle=col; rr(x,y,w*Math.min(1,t),8,4); ctx.fill();
}
function drawMaps(){
  clearBtns();
  ctx.fillStyle='#16213e'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff'; ctx.font='bold 26px sans-serif'; ctx.textAlign='center';
  ctx.fillText('ТРАССЫ', W/2, 46);
  var cw=Math.min(300,W-40), ch=90, gap=14;
  for(var i=0;i<MAPS.length;i++){
    var m=MAPS[i], y=70+i*(ch+gap);
    if(y>H-70) break;
    var x=(W-cw)/2;
    ctx.fillStyle = SAVE.map===i ? '#1e4d8c':'#233255';
    rr(x,y,cw,ch,14); ctx.fill();
    ctx.fillStyle=m.sky; rr(x+12,y+12,ch-24,ch-24,10); ctx.fill();
    ctx.fillStyle=m.road; ctx.fillRect(x+12+ch*0.25,y+12,ch*0.3,ch-24);
    ctx.fillStyle='#fff'; ctx.font='bold 18px sans-serif'; ctx.textAlign='left';
    ctx.fillText(m.name, x+ch+8, y+34);
    ctx.font='13px sans-serif'; ctx.fillStyle='#a8b3d1';
    ctx.fillText(SAVE.map===i?'выбрана':'нажми, чтобы выбрать', x+ch+8, y+58);
    buttons.push({x:x,y:y,w:cw,h:ch,action:function(ii){ return function(){ SAVE.map=ii; persist(); sClick(); };}(i)});
  }
  drawButtons();
  var back={x:15,y:H-58,w:110,h:44,label:'← Назад'};
  buttons.push({x:back.x,y:back.y,w:back.w,h:back.h,action:function(){ state='menu'; }});
  drawBtn(back,'#34495e');
}
function drawOver(){
  ctx.fillStyle='rgba(10,10,20,0.75)'; ctx.fillRect(0,0,W,H);
  var bw=Math.min(280,W-60), bx=(W-bw)/2, by=H*0.3;
  ctx.fillStyle='#e94560'; ctx.font='bold 36px sans-serif'; ctx.textAlign='center';
  ctx.fillText('АВАРИЯ!', W/2, by-20);
  ctx.fillStyle='#fff'; ctx.font='22px sans-serif';
  ctx.fillText('Пройдено: '+score+' м', W/2, by+20);
  ctx.fillStyle='#f1c40f';
  ctx.fillText('+'+coinsRun+' монет', W/2, by+52);
  if(score>=SAVE.best && score>0){ ctx.fillStyle='#2ecc71'; ctx.font='bold 18px sans-serif'; ctx.fillText('НОВЫЙ РЕКОРД!', W/2, by+84); }
  var b1={x:bx,y:by+120,w:bw,h:56,label:'Ещё раз'};
  var b2={x:bx,y:by+190,w:bw,h:56,label:'Гараж', col:'#8e44ad'};
  var b3={x:bx,y:by+260,w:bw,h:56,label:'В меню', col:'#34495e'};
  buttons.push({x:b1.x,y:b1.y,w:b1.w,h:b1.h,action:function(){ newGame(); state='play'; motorStart(); }});
  buttons.push({x:b2.x,y:b2.y,w:b2.w,h:b2.h,action:function(){ state='garage'; }});
  buttons.push({x:b3.x,y:b3.y,w:b3.w,h:b3.h,action:function(){ state='menu'; }});
  drawBtn(b1); drawBtn(b2,b2.col); drawBtn(b3,b3.col);
}
function drawPause(){
  ctx.fillStyle='rgba(10,10,20,0.7)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff'; ctx.font='bold 30px sans-serif'; ctx.textAlign='center';
  ctx.fillText('ПАУЗА', W/2, H*0.35);
  var bw=Math.min(260,W-60), bx=(W-bw)/2;
  buttons.push({x:bx,y:H*0.45,w:bw,h:56,action:function(){ state='play'; }});
  drawBtn({x:bx,y:H*0.45,w:bw,h:56,label:'Продолжить'});
  buttons.push({x:bx,y:H*0.45+70,w:bw,h:56,action:function(){ motorStop(); state='menu'; }});
  drawBtn({x:bx,y:H*0.45+70,w:bw,h:56,label:'В меню', col:'#34495e'});
}

/* ================= главный цикл ================= */
function frame(t){
  var dt = Math.min(0.05,(t-tPrev)/1000||0.016); tPrev=t;
  var map = MAPS[SAVE.map];
  ctx.save();
  if(shake>0 && state==='play'){
    ctx.translate((Math.random()*2-1)*shake*10,(Math.random()*2-1)*shake*10);
  }
  if(state==='play'&&G) { update(dt); }
  if(state==='menu') drawMenu();
  else if(state==='garage') drawGarage();
  else if(state==='maps') drawMaps();
  else if(state==='play'||state==='pause'||state==='over'){
    if(!G) newGame();
    drawGame(map);
    if(state==='over'){ clearBtns(); drawOver(); }
    if(state==='pause'){ clearBtns(); drawPause(); }
  }
  if(flash>0){ ctx.fillStyle='rgba(255,255,255,'+flash*0.6+')'; ctx.fillRect(0,0,W,H); }
  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(function(t){ tPrev=t; requestAnimationFrame(frame); });

/* ================= обработчик тапов (меню vs игра) ================= */
function unifiedTap(px,py){
  if(state==='play'&&!G.dead) onTap(px,py);
  else uiTap(px,py);
}
function unified(e){
  audioInit();
  if(AC && AC.state==='suspended'){ try{AC.resume();}catch(e2){} }
  var list = e.changedTouches||[e];
  for(var i=0;i<list.length;i++){
    var t=list[i];
    unifiedTap(t.clientX,t.clientY);
  }
  e.preventDefault();
}
cv.removeEventListener('touchstart', pointer);
cv.removeEventListener('mousedown', pointer);
cv.addEventListener('touchstart', unified, {passive:false});
cv.addEventListener('mousedown', unified);

/* ================= плашка ошибок ================= */
window.onerror = function(msg, src, line){
  var d=document.createElement('div');
  d.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#a00;color:#fff;padding:10px;font-size:12px;z-index:99999;white-space:pre-wrap;';
  d.textContent='Ошибка: '+msg+' (строка '+line+')';
  document.body.appendChild(d);
  return false;
};
</script>
