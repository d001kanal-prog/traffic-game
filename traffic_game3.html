<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Машина в потоке</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#141824;font-family:'Segoe UI',Roboto,Arial,sans-serif;user-select:none;touch-action:manipulation}
#game{position:fixed;inset:0}
#ui{position:fixed;inset:0;pointer-events:none}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(15,19,33,.86);border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:26px 24px;width:320px;max-width:92vw;max-height:88vh;overflow-y:auto;text-align:center;pointer-events:auto;backdrop-filter:blur(10px);box-shadow:0 24px 70px rgba(0,0,0,.65)}
.hidden{display:none!important}
h1{color:#fff;font-size:33px;letter-spacing:3px;line-height:1.15;margin-bottom:4px;text-shadow:0 3px 14px rgba(255,140,0,.45)}
.sub{color:#9fb2d8;font-size:13px;margin-bottom:16px}
.coins-line{color:#ffd35e;font-size:18px;font-weight:700;margin-bottom:16px}
.btn{display:block;width:100%;margin:10px 0;padding:14px;border:none;border-radius:14px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(180deg,#ff9f43,#f5731c);box-shadow:0 4px 0 #b85a10,0 10px 24px rgba(245,115,28,.35);cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b85a10}
.btn.sec{background:linear-gradient(180deg,#4a5a8a,#333f63);box-shadow:0 4px 0 #232c48,0 8px 20px rgba(0,0,0,.35)}
.btn.sm{padding:10px;font-size:14px}
.btn.off{opacity:.55}
.ptitle{color:#fff;font-size:22px;font-weight:800;margin-bottom:14px}
.gcard{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:2px solid transparent;border-radius:16px;padding:8px;margin:10px 0;text-align:left}
.gcard.sel{border-color:#ffb142;background:rgba(255,177,66,.08)}
.gprev{flex:none;border-radius:10px}
.ginfo{flex:1;min-width:0}
.gname{color:#fff;font-weight:800;font-size:15px}
.gdesc{color:#9fb2d8;font-size:11px;margin:1px 0 5px}
.stat{color:#7f92bd;font-size:10px;letter-spacing:.5px}
.bar{height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;margin:2px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb142,#ff6b6b);border-radius:3px}
.gbuy{width:100%;margin-top:3px;padding:7px;border:none;border-radius:9px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(180deg,#2ecc71,#1faa5c);cursor:pointer;font-family:inherit}
.gbuy.sel{background:linear-gradient(180deg,#5a6a95,#414d70)}
.mcard{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border:2px solid transparent;border-radius:16px;padding:10px 12px;margin:10px 0;text-align:left;cursor:pointer}
.mcard.sel{border-color:#ffb142}
.msw{width:52px;height:36px;border-radius:8px;flex:none}
.mname{color:#fff;font-weight:700}
.mdesc{color:#9fb2d8;font-size:12px}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px;pointer-events:none;color:#fff;font-weight:800;text-shadow:0 2px 5px rgba(0,0,0,.8);font-size:18px;z-index:5}
#hud .hcol{display:flex;flex-direction:column;gap:2px}
#hud .hcoin{color:#ffd35e}
#btnPause{pointer-events:auto;width:44px;height:44px;border:none;border-radius:12px;background:rgba(15,19,33,.7);color:#fff;font-size:17px;font-weight:800;cursor:pointer;border:1px solid rgba(255,255,255,.2)}
#panelPause .btn{margin:8px 0}
.res{color:#fff;font-size:15px;margin:4px 0}
.res b{color:#ffd35e}
#err{position:fixed;bottom:0;left:0;right:0;background:#a00;color:#fff;padding:8px 10px;font-size:12px;z-index:99999;white-space:pre-wrap;display:none}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="hcol"><span id="hScore">0 м</span><span style="font-size:11px;opacity:.75" id="hBest">рекорд 0</span></div>
  <div class="hcol" style="align-items:flex-end"><span class="hcoin" id="hCoins">🪙 0</span><button id="btnPause">❚❚</button></div>
</div>

<div id="ui">
  <div class="panel" id="panelMenu">
    <h1>МАШИНА<br>В ПОТОКЕ</h1>
    <div class="sub">не врежься — собирай монеты</div>
    <div class="coins-line">🪙 <span id="menuCoins">0</span></div>
    <button class="btn" id="btnPlay">Играть</button>
    <button class="btn sec" id="btnGarage">Гараж</button>
    <button class="btn sec" id="btnMap">Трасса</button>
    <button class="btn sec sm" id="btnSound">Звук: вкл</button>
  </div>

  <div class="panel hidden" id="panelGarage">
    <div class="ptitle">ГАРАЖ</div>
    <div class="coins-line">🪙 <span id="garageCoins">0</span></div>
    <div id="garageList"></div>
    <button class="btn sec" id="btnGarageBack">Назад</button>
  </div>

  <div class="panel hidden" id="panelMaps">
    <div class="ptitle">ТРАССА</div>
    <div id="mapList"></div>
    <button class="btn sec" id="btnMapBack">Назад</button>
  </div>

  <div class="panel hidden" id="panelOver">
    <div class="ptitle">💥 Авария!</div>
    <div class="res">Пройдено: <b id="oScore">0</b></div>
    <div class="res">Монеты: <b id="oCoins">+0 🪙</b></div>
    <div class="res" id="oBest">Рекорд: 0</div>
    <button class="btn" id="btnAgain">Ещё раз</button>
    <button class="btn sec" id="btnMenu">В меню</button>
  </div>

  <div class="panel hidden" id="panelPause">
    <div class="ptitle">Пауза</div>
    <button class="btn" id="btnResume">Продолжить</button>
    <button class="btn sec" id="btnToMenu">В меню</button>
  </div>
</div>
<div id="err"></div>

<script>
'use strict';
window.onerror=function(m,s,l){var d=document.getElementById('err');d.style.display='block';d.textContent='Ошибка: '+m+' (строка '+l+')';};

// ================= ХРАНЕНИЕ =================
function lsGet(k,d){try{var v=localStorage.getItem('tgr_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem('tgr_'+k,JSON.stringify(v));}catch(e){}}
var tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
var S={coins:lsGet('coins',0),best:lsGet('best',0),owned:lsGet('owned',['city']),sel:lsGet('sel','city'),sound:lsGet('sound',true),map:lsGet('map','city')};
if(!S.owned||!S.owned.length)S.owned=['city'];
if(S.owned.indexOf(S.sel)<0)S.sel=S.owned[0];
function saveState(){lsSet('coins',S.coins);lsSet('best',S.best);lsSet('owned',S.owned);lsSet('sel',S.sel);lsSet('sound',S.sound);lsSet('map',S.map);
 if(tg&&tg.CloudStorage){try{tg.CloudStorage.setItem('tgr_save',JSON.stringify(S));}catch(e){}}}
function applySave(o){if(!o)return;if(o.coins>S.coins)S.coins=o.coins;if(o.best>S.best)S.best=o.best;
 var own=S.owned.slice();(o.owned||[]).forEach(function(c){if(own.indexOf(c)<0)own.push(c);});S.owned=own;
 if(o.map&&MAP_IDS.indexOf(o.map)>=0)S.map=o.map;}
if(tg&&tg.CloudStorage){try{tg.CloudStorage.getItem('tgr_save',function(e,v){if(!e&&v){try{applySave(JSON.parse(v));refreshUI();}catch(x){}}});}catch(e){}}
try{if(tg){tg.ready();tg.expand();if(tg.requestFullscreen)tg.requestFullscreen();}}catch(e){}

// ================= ДАННЫЕ =================
var CARS=[
 {id:'city',  name:'Сити',      desc:'Надёжная классика',        price:0,   w:0.56, sp:1.00, hd:1.00, color:'#d64541', kind:'sedan'},
 {id:'jeep',  name:'Джип',      desc:'Широкий и цепкий',         price:120, w:0.68, sp:0.92, hd:1.40, color:'#2f8f5b', kind:'jeep'},
 {id:'sport', name:'Спорт',     desc:'Быстрый, но резкий',       price:300, w:0.52, sp:1.35, hd:0.75, color:'#f39c12', kind:'sport'},
 {id:'cabrio',name:'Кабриолет', desc:'Лёгкий и юркий',           price:520, w:0.55, sp:1.12, hd:1.18, color:'#9b59b6', kind:'cabrio'},
 {id:'super', name:'Суперкар',  desc:'Молния с норовом',         price:1000,w:0.55, sp:1.65, hd:0.62, color:'#17c3e6', kind:'super'}
];
var MAPS=[
 {id:'city',  name:'Город',   desc:'День, дома и деревья',  ground:'#43503f',road:'#3b4048',road2:'#343941',edge:'#e9e5d2',line:'#f7f2dc',npc:['#d64541','#4a90d9','#f2c037','#7f8c8d','#2ecc71','#e67e22'],dec:['building','tree','lamp'],night:false,bcol:'#39415a'},
 {id:'night', name:'Ночь',    desc:'Фары и неон витрин',    ground:'#171c2b',road:'#232838',road2:'#1d2231',edge:'#c9d4ee',line:'#dfe6ff',npc:['#5468a8','#a04a6e','#4fae9b','#8a8fa3','#c9a13d'],dec:['building','lamp'],night:true,bcol:'#232b45'},
 {id:'desert',name:'Пустыня', desc:'Жара, кактусы и скалы', ground:'#d9b36a',road:'#5c5551',road2:'#534c48',edge:'#f4ead2',line:'#f4ead2',npc:['#c0392b','#d9a03c','#7f9bb0','#96674a','#b85450'],dec:['cactus','rock','lamp'],night:false,bcol:''},
 {id:'winter',name:'Зима',    desc:'Снег и заснеженные ели',ground:'#dde6ee',road:'#5b616b',road2:'#525862',edge:'#f5f8fc',line:'#eef3f8',npc:['#a03a3a','#3a6ea0','#4f8f5f','#7a5fa0','#5a6b7a'],dec:['pine','snowhill','lamp'],night:false,bcol:''}
];
var MAP_IDS=MAPS.map(function(m){return m.id;});
function curMap(){for(var i=0;i<MAPS.length;i++)if(MAPS[i].id===S.map)return MAPS[i];return MAPS[0];}
function curCar(){for(var i=0;i<CARS.length;i++)if(CARS[i].id===S.sel)return CARS[i];return CARS[0];}

// ================= ЗВУК =================
var AC=null,eng=null,engG=null,engF=null;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
 eng=AC.createOscillator();eng.type='sawtooth';engF=AC.createBiquadFilter();engF.type='lowpass';engF.frequency.value=420;
 engG=AC.createGain();engG.gain.value=0;eng.frequency.value=55;eng.connect(engF);engF.connect(engG);engG.connect(AC.destination);eng.start();}
function engineUpd(v,on){if(!AC||!engG)return;try{eng.frequency.setTargetAtTime(48+v*95,AC.currentTime,0.12);engG.gain.setTargetAtTime(on?0.045:0,AC.currentTime,0.18);}catch(e){}}
function beep(f,d,type,v){if(!AC||!S.sound)return;try{var o=AC.createOscillator(),gn=AC.createGain();o.type=type||'square';o.frequency.value=f;gn.gain.setValueAtTime(v||0.1,AC.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function noiseS(d,v){if(!AC||!S.sound)return;try{var n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0);for(var i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);var src=AC.createBufferSource();src.buffer=b;var gn=AC.createGain();gn.gain.value=v||0.25;src.connect(gn);gn.connect(AC.destination);src.start();}catch(e){}}
function sCoin(){beep(990,0.07,'square',0.09);setTimeout(function(){beep(1320,0.09,'square',0.08);},60);}
function sGem(){beep(700,0.08,'sine',0.12);setTimeout(function(){beep(1050,0.08,'sine',0.12);},70);setTimeout(function(){beep(1400,0.12,'sine',0.12);},140);}
function sSwish(){noiseS(0.10,0.07);}
function sCrash(){noiseS(0.6,0.5);beep(90,0.5,'sawtooth',0.3);}
function sClick(){beep(640,0.05,'square',0.06);}
if(tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred){var haptic=function(s){try{tg.HapticFeedback.impactOccurred(s);}catch(e){}};}else{var haptic=function(){};}

// ================= ХОЛСТ =================
var cv=document.getElementById('game'),g=cv.getContext('2d');
var W=0,H=0;
function resize(){var d=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';g.setTransform(d,0,0,d,0,0);}
window.addEventListener('resize',resize);resize();
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function shade(hex,p){var n=parseInt(hex.slice(1),16);var r=Math.max(0,Math.min(255,(n>>16)+p)),gg=Math.max(0,Math.min(255,((n>>8)&255)+p)),b=Math.max(0,Math.min(255,(n&255)+p));return 'rgb('+r+','+gg+','+b+')';}
function rnd(a){var x=Math.sin(a*127.13+11.7)*43758.545;return x-Math.floor(x);}

// ================= РИСОВАНИЕ МАШИН =================
function glass(c,x,y,w,h){var gr=c.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'#d5ecff');gr.addColorStop(0.5,'#7fa8c9');gr.addColorStop(1,'#3f617f');c.fillStyle=gr;rr(c,x,y,w,h,2);c.fill();c.fillStyle='rgba(255,255,255,0.4)';c.fillRect(x+w*0.2,y+h*0.18,Math.max(1,w*0.1),h*0.64);}

function drawCar(c,x,y,w,h,spec,front,night,t){
 var col=spec.color,dark=shade(col,-38),light=shade(col,30),kind=spec.kind||'sedan';
 c.fillStyle='rgba(0,0,0,0.28)';
 c.beginPath();c.ellipse(x+w/2+2,y+h/2+3,w*0.58,h*0.52,0,0,7);c.fill();
 c.save();c.translate(x+w/2,y+h/2);if(front<0)c.rotate(Math.PI);c.translate(-w/2,-h/2);
 if(kind==='truck'){
   c.fillStyle=dark;rr(c,w*0.04,h*0.02,w*0.92,h*0.30,4);c.fill();
   var gr=c.createLinearGradient(0,h*0.3,0,h);gr.addColorStop(0,'#cfd4da');gr.addColorStop(1,'#9aa1ab');
   c.fillStyle=gr;rr(c,w*0.02,h*0.33,w*0.96,h*0.64,3);c.fill();
   c.strokeStyle='rgba(0,0,0,0.25)';c.lineWidth=1;
   for(var i=1;i<5;i++){c.beginPath();c.moveTo(w*0.04,h*0.33+i*h*0.13);c.lineTo(w*0.96,h*0.33+i*h*0.13);c.stroke();}
   c.fillStyle=col;c.fillRect(w*0.02,h*0.36,w*0.96,h*0.07);
 }else{
   var rad=Math.min(w,h)*(kind==='jeep'?0.13:0.22);
   var gr=c.createLinearGradient(0,0,0,h);
   gr.addColorStop(0,light);gr.addColorStop(0.45,col);gr.addColorStop(1,dark);
   c.fillStyle=gr;rr(c,0,0,w,h,rad);c.fill();
   c.strokeStyle='rgba(0,0,0,0.5)';c.lineWidth=1.5;rr(c,0,0,w,h,rad);c.stroke();
   c.fillStyle='rgba(255,255,255,0.16)';rr(c,w*0.08,h*0.03,w*0.84,h*0.10,rad*0.6);c.fill();
   var cabX=w*0.13,cabW=w*0.74;
   if(kind==='cabrio'){
     glass(c,cabX+w*0.02,h*0.30,cabW-w*0.04,h*0.12);
     c.fillStyle=shade(col,-50);
     rr(c,cabX+w*0.05,h*0.50,w*0.27,h*0.17,4);c.fill();
     rr(c,cabX+cabW-w*0.32,h*0.50,w*0.27,h*0.17,4);c.fill();
   }else{
     c.fillStyle=dark;rr(c,cabX,h*0.25,cabW,h*0.47,4);c.fill();
     glass(c,cabX+w*0.04,h*0.265,cabW-w*0.08,h*0.14);
     glass(c,cabX+w*0.04,h*0.575,cabW-w*0.08,h*0.13);
     glass(c,cabX,h*0.42,w*0.05,h*0.15);glass(c,cabX+cabW-w*0.05,h*0.42,w*0.05,h*0.15);
   }
   if(kind==='sport'||kind==='super'){
     c.fillStyle='rgba(255,255,255,0.55)';c.fillRect(w*0.40,0,w*0.06,h);c.fillRect(w*0.54,0,w*0.06,h);
     c.fillStyle=shade(col,-55);rr(c,-w*0.04,h*0.93,w*1.08,h*0.055,3);c.fill();
     c.fillRect(w*0.16,h*0.88,w*0.08,h*0.05);c.fillRect(w*0.76,h*0.88,w*0.08,h*0.05);
   }
   if(kind==='jeep'){
     c.fillStyle=shade(col,-55);rr(c,cabX+w*0.06,h*0.30,cabW-w*0.12,h*0.09,2);c.fill();
     c.fillStyle='rgba(255,255,255,0.25)';for(var j=0;j<4;j++)c.fillRect(cabX+w*(0.10+j*0.19),h*0.315,w*0.02,h*0.075);
   }
   if(kind==='taxi'){c.fillStyle='#f7d046';rr(c,w*0.34,h*0.46,w*0.32,h*0.08,2);c.fill();}
   if(kind==='sedan'&&spec.taxiStripe){c.fillStyle='#2c3e50';c.fillRect(0,h*0.40,w,h*0.05);}
 }
 c.fillStyle=dark;
 var ww=w*0.14,wh=h*0.15;
 rr(c,-ww*0.4,h*0.07,ww,wh,3);c.fill();rr(c,w-ww*0.6,h*0.07,ww,wh,3);c.fill();
 rr(c,-ww*0.4,h*0.78,ww,wh,3);c.fill();rr(c,w-ww*0.6,h*0.78,ww,wh,3);c.fill();
 if(night){
   var cone=c.createLinearGradient(0,0,0,h*2.1);
   cone.addColorStop(0,'rgba(255,240,180,0.28)');cone.addColorStop(1,'rgba(255,240,180,0)');
   c.fillStyle=cone;c.beginPath();c.moveTo(w*0.18,h*0.02);c.lineTo(w*0.82,h*0.02);c.lineTo(w*1.5,h*2.1);c.lineTo(-w*0.5,h*2.1);c.closePath();c.fill();
 }
 c.fillStyle=night?'#fff8d8':'#ffefb0';
 rr(c,w*0.11,h*0.015,w*0.2,h*0.05,2);c.fill();rr(c,w*0.69,h*0.015,w*0.2,h*0.05,2);c.fill();
 c.fillStyle='#ff4136';
 rr(c,w*0.11,h*0.935,w*0.2,h*0.05,2);c.fill();rr(c,w*0.69,h*0.935,w*0.2,h*0.05,2);c.fill();
 if(night){
   c.fillStyle='rgba(255,60,50,0.35)';
   rr(c,w*0.08,h*0.91,w*0.84,h*0.10,4);c.fill();
 }
 if(spec.blink>0&&Math.floor(t*6)%2===0){
   c.fillStyle='#ffb142';
   if(spec.blinkDir<0)c.fillRect(-w*0.04,h*0.30,w*0.08,h*0.07);else c.fillRect(w*0.96,h*0.30,w*0.08,h*0.07);
 }
 c.restore();
}

// ================= ИГРОВОЕ СОСТОЯНИЕ =================
var gameState='menu',paused=false,crashT=0;
var lanes=4,roadW=0,roadX=0,laneW=0,carH=0;
var runT=0,score=0,runCoins=0,worldY=0,spawnT=1,coinT=0.6,shake=0,flash=0;
var npcs=[],coins=[],parts=[],decor=[],flakes=[];
var player={lane:1,x:0,y:0,w:0,h:0,tx:0};
function calcSizes(){roadW=Math.min(W*0.92,540);roadX=(W-roadW)/2;laneW=roadW/lanes;carH=laneW*0.62;}
calcSizes();
function laneC(l){return roadX+laneW*(l+0.5);}
function laneFree(l,y0,y1,skip){
 for(var i=0;i<npcs.length;i++){var n=npcs[i];if(n===skip)continue;if(n.lane===l&&n.y+n.h>y0&&n.y<y1)return false;}
 for(var j=0;j<coins.length;j++){var o=coins[j];if(o.lane===l&&o.y>y0-20&&o.y<y1+20)return false;}
 return true;
}
function spawnCar(){
 var m=curMap();
 var l=Math.floor(Math.random()*lanes);
 var isTruck=Math.random()<0.18;
 var h=carH*(isTruck?1.6:1.06),w=carH*(isTruck?0.78:curCar().w>0.62?0.6:0.56);
 var y=-h-Math.random()*carH;
 if(!laneFree(l,y-h*2.2,y+h*2.2))return;
 var base=0.55+Math.random()*0.28+Math.min(runT/120,0.25);
 var col=m.npc[Math.floor(Math.random()*m.npc.length)];
 var spec={color:col,kind:isTruck?'truck':(Math.random()<0.14?'taxi':'sedan'),taxiStripe:Math.random()<0.5,blink:0,blinkDir:0,blocked:0};
 npcs.push({lane:l,x:laneC(l)-w/2,y:y,w:w,h:h,sp:base*curCar().sp,spec:spec});
}
function spawnCoin(){
 var l=Math.floor(Math.random()*lanes);
 if(!laneFree(l,-carH*1.5,carH*2.5))return;
 var gem=Math.random()<0.12;
 coins.push({lane:l,x:laneC(l),y:-20,gem:gem,ph:Math.random()*6});
 if(!gem&&Math.random()<0.35){coins.push({lane:l,x:laneC(l),y:-95,gem:false,ph:0});coins.push({lane:l,x:laneC(l),y:-170,gem:false,ph:0});}
}
function resetRun(){
 calcSizes();
 player.h=carH;player.w=carH*curCar().w;player.lane=Math.floor(lanes/2);player.x=laneC(player.lane);player.tx=player.x;player.y=H-carH*2.4;
 runT=0;score=0;runCoins=0;worldY=0;spawnT=1.2;coinT=0.8;shake=0;flash=0;crashT=0;
 npcs=[];coins=[];parts=[];decor=[];
 flakes=[];if(curMap().id==='winter'){for(var i=0;i<60;i++)flakes.push({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*2,v:30+Math.random()*50});}
}
function startGame(){resetRun();gameState='play';paused=false;showScreen(null);document.getElementById('hud').classList.remove('hidden');}
function doGameOver(){
 gameState='over';
 if(score>S.best){S.best=Math.floor(score);}
 S.coins+=runCoins;saveState();
 document.getElementById('oScore').textContent=Math.floor(score)+' м';
 document.getElementById('oCoins').textContent='+'+runCoins+' 🪙';
 document.getElementById('oBest').textContent='Рекорд: '+S.best+' м';
 document.getElementById('hud').classList.add('hidden');
 showScreen('panelOver');refreshUI();haptic('heavy');
}
function crash(){
 sCrash();haptic('heavy');shake=22;flash=1;crashT=0.9;
 for(var i=0;i<40;i++){parts.push({x:player.x+player.w/2,y:player.y+player.h/2,vx:(Math.random()-0.5)*380,vy:(Math.random()-0.5)*380-60,life:0.5+Math.random()*0.6,sz:2+Math.random()*5,col:['#ffcf4d','#ff7b3b','#ff4136','#888'][Math.floor(Math.random()*4)]});}
 engineUpd(0,false);
}

// ================= ОБНОВЛЕНИЕ =================
function update(dt){
 if(crashT>0){crashT-=dt;upParts(dt);if(crashT<=0)doGameOver();return;}
 runT+=dt;
 var car=curCar();
 var base=H*0.5*(1+Math.min(runT/75,0.9));
 var scroll=base*car.sp;
 worldY+=scroll*dt;
 score+=scroll*dt*0.045;
 // игрок
 var rate=6+car.hd*5;
 var tgt=laneC(player.lane);
 player.x+=(tgt-player.x)*Math.min(1,rate*dt);
 // спавн
 spawnT-=dt;
 if(spawnT<=0){spawnCar();spawnT=Math.max(0.4,1.15-runT*0.007)*(0.65+Math.random()*0.7);}
 coinT-=dt;
 if(coinT<=0){spawnCoin();coinT=(0.7+Math.random()*1.1)/Math.min(1+runT/60,1.6);}
 // трафик
 for(var i=0;i<npcs.length;i++){var n=npcs[i];
   var ahead=null,minY=1e9;
   for(var j=0;j<npcs.length;j++){var m2=npcs[j];if(m2!==n&&m2.lane===n.lane&&m2.y>n.y&&m2.y<minY){minY=m2.y;ahead=m2;}}
   if(ahead&&ahead.y-(n.y+n.h)<n.h*0.85+n.sp*90){
     n.sp=Math.min(n.sp,Math.max(0.3,ahead.sp*0.96));n.spec.blocked+=dt;
     if(n.spec.blocked>1.4&&Math.random()<0.5){
       var d=Math.random()<0.5?-1:1,tl=n.lane+d;
       if(tl>=0&&tl<lanes&&laneFree(tl,n.y-carH*1.6,n.y+n.h+carH*1.6,n)){
         if(!(tl===player.lane&&Math.abs(player.y-n.y)<carH*2.2)){
           n.lane=tl;n.spec.blinkDir=d;n.spec.blink=1;n.spec.blocked=0;
         }
       }
     }
   }else{n.spec.blocked=0;}
   n.y+=(scroll-n.sp*base)*dt;
   if(n.spec.blink>0)n.spec.blink-=dt;
   n.x+=(laneC(n.lane)-laneW*n.w/laneW/2-n.x)*Math.min(1,7*dt);
   n.x=laneC(n.lane)-n.w/2;
 }
 for(var k=npcs.length-1;k>=0;k--)if(npcs[k].y>H+80)npcs.splice(k,1);
 // монеты
 for(var c2=coins.length-1;c2>=0;c2--){var o=coins[c2];o.y+=scroll*dt;
   if(o.y>H+30){coins.splice(c2,1);continue;}
   var dx=o.x-(player.x+player.w/2),dy=o.y-(player.y+player.h/2);
   if(dx*dx+dy*dy<(carH*0.45)*(carH*0.45)){
     coins.splice(c2,1);
     if(o.gem){runCoins+=5;sGem();}else{runCoins+=1;sCoin();}
     document.getElementById('hCoins').textContent='🪙 '+runCoins;
   }
 }
 // декор
 var seg=150;
 while(decor.length<40){var kk=Math.floor(Math.random()*100000);decor.push({k:kk,y:-40-Math.random()*80,type:curMap().dec[Math.floor(Math.random()*curMap().dec.length)],side:Math.random()<0.5?-1:1,off:20+rnd(kk)*120});}
 for(var d2=decor.length-1;d2>=0;d2--){decor[d2].y+=scroll*dt;if(decor[d2].y>H+260)decor.splice(d2,1);}
 if(curMap().id==='winter'){for(var f=0;f<flakes.length;f++){var fl=flakes[f];fl.y+=fl.v*dt;fl.x+=Math.sin(worldY*0.01+f)*12*dt;if(fl.y>H){fl.y=-5;fl.x=Math.random()*W;}}}
 upParts(dt);
 shake*=Math.pow(0.02,dt);if(shake<0.3)shake=0;
 flash=Math.max(0,flash-dt*2.2);
 // столкновения
 var px=player.x+5,py=player.y+6,pw=player.w-10,ph=player.h-10;
 for(var q=0;q<npcs.length;q++){var e=npcs[q];
   if(px<e.x+e.w-6&&px+pw>e.x+6&&py<e.y+e.h-6&&py+ph>e.y+6){crash();return;}
 }
 engineUpd(scroll/H,gameState==='play'&&!paused);
}
function upParts(dt){for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1);}}

// ================= ОТРИСОВКА СЦЕНЫ =================
function drawDecorItem(d,map,t){
 var x=(d.side<0?roadX:roadX+roadW);
 var px=d.side<0?x-d.off:x+d.off;
 var gy=d.y;
 if(d.type==='building'){
   var bw=34+rnd(d.k)*30,bh=90+rnd(d.k*3)*120;
   var bx=px+(d.side<0?-bw:0);
   g.fillStyle=map.bcol;g.fillRect(bx,gy-bh,bw,bh);
   g.fillStyle='rgba(0,0,0,0.25)';g.fillRect(d.side<0?bx+bw-4:bx,gy-bh,4,bh);
   var cols=Math.floor(bw/13),rows=Math.floor(bh/17);
   for(var i=0;i<cols;i++)for(var j2=0;j2<rows;j2++){
     if(rnd(d.k*31+i*7+j2*13)>0.42){
       g.fillStyle=map.night?'rgba(255,214,120,0.85)':'rgba(170,205,240,0.45)';
       g.fillRect(bx+5+i*13,gy-bh+6+j2*17,7,9);
     }
   }
 }else if(d.type==='tree'){
   g.fillStyle='#5a4028';g.fillRect(px-3,gy-16,6,16);
   g.fillStyle=map.night?'#1e3d28':'#3e7d3a';
   g.beginPath();g.arc(px,gy-26,14+rnd(d.k)*6,0,7);g.fill();
   g.fillStyle='rgba(255,255,255,0.12)';g.beginPath();g.arc(px-4,gy-30,7,0,7);g.fill();
 }else if(d.type==='pine'){
   g.fillStyle='#4a3620';g.fillRect(px-3,gy-12,6,12);
   g.fillStyle='#2c5234';
   for(var s2=0;s2<3;s2++){var ww=22-s2*6,yy=gy-12-s2*16;
     g.beginPath();g.moveTo(px,yy-20);g.lineTo(px-ww/2,yy);g.lineTo(px+ww/2,yy);g.closePath();g.fill();}
   g.fillStyle='rgba(255,255,255,0.75)';
   g.beginPath();g.moveTo(px,gy-64);g.lineTo(px-6,gy-52);g.lineTo(px+6,gy-52);g.closePath();g.fill();
 }else if(d.type==='cactus'){
   g.fillStyle='#3f8f4f';rr(g,px-5,gy-34,10,34,5);g.fill();
   rr(g,px-15,gy-26,8,12,4);g.fill();rr(g,px+7,gy-20,8,10,4);g.fill();
 }else if(d.type==='rock'){
   g.fillStyle='#8d8478';g.beginPath();g.ellipse(px,gy-6,14,9,0,0,7);g.fill();
   g.fillStyle='rgba(255,255,255,0.2)';g.beginPath();g.ellipse(px-4,gy-9,7,4,0,0,7);g.fill();
 }else if(d.type==='snowhill'){
   g.fillStyle='rgba(255,255,255,0.85)';g.beginPath();g.ellipse(px,gy,22,7,0,0,7);g.fill();
 }else if(d.type==='lamp'){
   var lx=d.side<0?roadX-8:roadX+roadW+8;
   g.fillStyle='#3a3f48';g.fillRect(lx-2,gy-46,4,46);
   g.fillStyle='#ffe9a8';g.beginPath();g.arc(lx,gy-48,4,0,7);g.fill();
   if(map.night){var lg=g.createRadialGradient(lx,gy-48,2,lx,gy-48,60);lg.addColorStop(0,'rgba(255,230,150,0.25)');lg.addColorStop(1,'rgba(255,230,150,0)');g.fillStyle=lg;g.beginPath();g.arc(lx,gy-48,60,0,7);g.fill();}
 }
}
function drawScene(map,t){
 g.fillStyle=map.ground;g.fillRect(0,0,W,H);
 for(var i=0;i<decor.length;i++)drawDecorItem(decor[i],map,t);
 g.fillStyle=map.road;g.fillRect(roadX,0,roadW,H);
 g.fillStyle='rgba(0,0,0,0.18)';g.fillRect(roadX,0,6,H);g.fillRect(roadX+roadW-6,0,6,H);
 g.fillStyle=map.edge;g.fillRect(roadX+8,0,4,H);g.fillRect(roadX+roadW-12,0,4,H);
 g.fillStyle=map.line;
 var dash=46,gap=34,per=dash+gap,off=worldY%per;
 for(var l=1;l<lanes;l++){
   var lx=roadX+laneW*l-2;
   for(var y=-per+off;y<H;y+=per)g.fillRect(lx,y,4,dash);
 }
}
function drawCoin(o,t){
 var b=Math.sin(t*5+o.ph)*2;
 if(o.gem){
   g.save();g.translate(o.x,o.y+b);
   g.fillStyle='rgba(60,190,255,0.25)';g.beginPath();g.arc(0,0,13,0,7);g.fill();
   g.fillStyle='#2fa8e0';g.beginPath();g.moveTo(0,-11);g.lineTo(9,0);g.lineTo(0,11);g.lineTo(-9,0);g.closePath();g.fill();
   g.fillStyle='#8fd8ff';g.beginPath();g.moveTo(0,-11);g.lineTo(9,0);g.lineTo(0,-1);g.closePath();g.fill();
   g.fillStyle='rgba(255,255,255,0.8)';g.fillRect(-2,-7,3,4);
   g.restore();
 }else{
   g.save();g.translate(o.x,o.y+b);
   g.fillStyle='rgba(255,200,60,0.22)';g.beginPath();g.arc(0,0,13,0,7);g.fill();
   g.fillStyle='#e8a41c';g.beginPath();g.arc(0,0,9.5,0,7);g.fill();
   g.fillStyle='#ffd35e';g.beginPath();g.arc(0,-1,8,0,7);g.fill();
   g.strokeStyle='#c78a12';g.lineWidth=1.5;g.beginPath();g.arc(0,-1,5.2,0,7);g.stroke();
   g.fillStyle='rgba(255,255,255,0.75)';g.beginPath();g.arc(-3,-4,2,0,7);g.fill();
   g.restore();
 }
}
function draw(t){
 var map=curMap();
 g.save();
 if(shake>0)g.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
 drawScene(map,t);
 for(var i=0;i<coins.length;i++)drawCoin(coins[i],t);
 var list=npcs.slice().sort(function(a,b){return a.y-b.y;});
 for(var j=0;j<list.length;j++){var n=list[j];drawCar(g,n.x,n.y,n.w,n.h,n.spec,-1,map.night,t);}
 if(gameState!=='over'||crashT>0)drawCar(g,player.x,player.y,player.w,player.h,{color:curCar().color,kind:curCar().kind},1,map.night,t);
 for(var p=0;p<parts.length;p++){var q=parts[p];g.globalAlpha=Math.max(0,q.life*1.6);g.fillStyle=q.col;g.fillRect(q.x-q.sz/2,q.y-q.sz/2,q.sz,q.sz);}
 g.globalAlpha=1;
 if(map.id==='winter'){g.fillStyle='rgba(255,255,255,0.8)';for(var f=0;f<flakes.length;f++){g.beginPath();g.arc(flakes[f].x,flakes[f].y,flakes[f].s,0,7);g.fill();}}
 if(flash>0){g.fillStyle='rgba(255,235,200,'+(flash*0.55)+')';g.fillRect(0,0,W,H);}
 g.restore();
 if(paused){g.fillStyle='rgba(10,14,24,0.55)';g.fillRect(0,0,W,H);}
}

// ================= ЦИКЛ =================
var last=0;
function loop(ts){
 requestAnimationFrame(loop);
 var dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;
 if(gameState==='play'&&!paused)update(dt);
 else if(gameState!=='play'){worldY+=H*0.04*dt;}
 if(gameState==='play'||gameState==='over')draw(ts/1000);
 else drawScene(curMap(),ts/1000);
}
requestAnimationFrame(loop);

// ================= УПРАВЛЕНИЕ =================
function tapLane(x){
 if(gameState!=='play'||paused||crashT>0)return;
 var car=curCar();
 if(x<W/2){if(player.lane>0)player.lane--;}else{if(player.lane<lanes-1)player.lane++;}
 sSwish();haptic('light');
}
window.addEventListener('pointerdown',function(e){
 initAudio();if(AC&&AC.state==='suspended')try{AC.resume();}catch(x){}
 if(e.target.closest('.panel,#btnPause'))return;
 tapLane(e.clientX);
});
window.addEventListener('keydown',function(e){
 if(gameState!=='play'||paused)return;
 if(e.key==='ArrowLeft'&&player.lane>0){player.lane--;sSwish();}
 if(e.key==='ArrowRight'&&player.lane<lanes-1){player.lane++;sSwish();}
});
document.addEventListener('visibilitychange',function(){if(document.hidden&&gameState==='play'&&!paused)togglePause();});
function togglePause(){
 if(gameState!=='play')return;
 paused=!paused;engineUpd(0,!paused);
 if(paused)showScreen('panelPause');else{showScreen(null);}
}

// ================= ИНТЕРФЕЙС =================
function showScreen(id){
 var ids=['panelMenu','panelGarage','panelMaps','panelOver','panelPause'];
 for(var i=0;i<ids.length;i++)document.getElementById(ids[i]).classList.toggle('hidden',ids[i]!==id);
}
function refreshUI(){
 document.getElementById('menuCoins').textContent=S.coins;
 document.getElementById('garageCoins').textContent=S.coins;
 document.getElementById('btnSound').textContent='Звук: '+(S.sound?'вкл':'выкл');
}
function buildGarage(){
 var box=document.getElementById('garageList');box.innerHTML='';
 CARS.forEach(function(c){
  var owned=S.owned.indexOf(c.id)>=0,sel=S.sel===c.id;
  var sp=Math.max(8,Math.round((c.sp-0.75)/0.95*100)),hd=Math.max(8,Math.round((c.hd-0.5)/1.0*100));
  var d=document.createElement('div');d.className='gcard'+(sel?' sel':'');
  var btn=sel?'<button class="gbuy sel" disabled>Выбрана</button>':(owned?'<button class="gbuy" data-act="sel">Выбрать</button>':'<button class="gbuy" data-act="buy">'+(S.coins>=c.price?'Купить за 🪙 '+c.price:'Нужно 🪙 '+c.price)+'</button>');
  d.innerHTML='<canvas class="gprev" width="64" height="108"></canvas><div class="ginfo"><div class="gname">'+c.name+'</div><div class="gdesc">'+c.desc+'</div><div class="stat">Скорость '+sp+'%</div><div class="bar"><i style="width:'+sp+'%"></i></div><div class="stat">Управление '+hd+'%</div><div class="bar"><i style="width:'+hd+'%"></i></div>'+btn+'</div>';
  d.querySelector('.gbuy').addEventListener('click',function(ev){
    ev.stopPropagation();
    if(!owned){if(S.coins>=c.price){S.coins-=c.price;S.owned.push(c.id);S.sel=c.id;sGem();saveState();buildGarage();refreshUI();}}
    else{S.sel=c.id;saveState();buildGarage();sClick();}
  });
  box.appendChild(d);
  var pc=d.querySelector('.gprev').getContext('2d');
  pc.clearRect(0,0,64,108);drawCar(pc,10,10,44,88,{color:c.color,kind:c.kind},1,false,0);
 });
}
function buildMaps(){
 var box=document.getElementById('mapList');box.innerHTML='';
 MAPS.forEach(function(m){
  var d=document.createElement('div');d.className='mcard'+(S.map===m.id?' sel':'');
  d.innerHTML='<div class="msw" style="background:linear-gradient(160deg,'+m.ground+' 45%,'+m.road+' 45%)"></div><div><div class="mname">'+m.name+'</div><div class="mdesc">'+m.desc+'</div></div>';
  d.addEventListener('click',function(){S.map=m.id;saveState();sClick();buildMaps();});
  box.appendChild(d);
 });
}
document.getElementById('btnPlay').addEventListener('click',function(){initAudio();sClick();startGame();});
document.getElementById('btnGarage').addEventListener('click',function(){sClick();buildGarage();showScreen('panelGarage');});
document.getElementById('btnGarageBack').addEventListener('click',function(){sClick();showScreen('panelMenu');refreshUI();});
document.getElementById('btnMap').addEventListener('click',function(){sClick();buildMaps();showScreen('panelMaps');});
document.getElementById('btnMapBack').addEventListener('click',function(){sClick();showScreen('panelMenu');});
document.getElementById('btnSound').addEventListener('click',function(){S.sound=!S.sound;saveState();refreshUI();sClick();});
document.getElementById('btnAgain').addEventListener('click',function(){sClick();startGame();});
document.getElementById('btnMenu').addEventListener('click',function(){sClick();gameState='menu';showScreen('panelMenu');refreshUI();});
document.getElementById('btnPause').addEventListener('click',function(){sClick();togglePause();});
document.getElementById('btnResume').addEventListener('click',function(){sClick();togglePause();});
document.getElementById('btnToMenu').addEventListener('click',function(){paused=false;engineUpd(0,false);gameState='menu';document.getElementById('hud').classList.add('hidden');showScreen('panelMenu');refreshUI();});

// HUD
setInterval(function(){
 if(gameState==='play'){
  document.getElementById('hScore').textContent=Math.floor(score)+' м';
  document.getElementById('hBest').textContent='рекорд '+Math.max(S.best,Math.floor(score));
 }
},120);
refreshUI();
</script>
