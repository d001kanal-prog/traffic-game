'use strict';
window.onerror=function(m,s,l){try{var d=document.createElement('div');d.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#a00;color:#fff;padding:10px;font-size:12px;z-index:99999;white-space:pre-wrap;';d.textContent=m+' ('+l+')';document.body.appendChild(d);}catch(e){}};

var TG=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
try{if(TG){TG.ready();TG.expand();if(TG.requestFullscreen)TG.requestFullscreen();}}catch(e){}

var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=0,H=0;
function resize(){var d=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);}
window.addEventListener('resize',resize);resize();

var SAVE_KEY='traffic_racer_save_v2';
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
var data={coins:0,owned:[true,false,false,false,false],sel:0,best:0,map:0,sound:true};
(function(){var r=lsGet(SAVE_KEY);if(r){try{var d=JSON.parse(r);for(var k in data){if(d[k]!==undefined)data[k]=d[k];}}catch(e){}}
if(TG&&TG.CloudStorage){try{TG.CloudStorage.getItem(SAVE_KEY,function(e,v){if(!e&&v){try{var d2=JSON.parse(v);for(var k2 in data){if(d2[k2]!==undefined)data[k2]=d2[k2];}}catch(e2){}}});}catch(e){}}})();
var saveT=null;
function saveNow(){var s=JSON.stringify(data);lsSet(SAVE_KEY,s);if(TG&&TG.CloudStorage){try{TG.CloudStorage.setItem(SAVE_KEY,s,function(){});}catch(e){}}}
function saveSoon(){if(saveT)return;saveT=setTimeout(function(){saveT=null;saveNow();},700);}

var CARS=[
 {name:'Сити',price:0,kind:'car',w:44,h:84,spd:1.00,hnd:1.00,c1:'#dfe4ec',c2:'#98a1b0',win:'#2b3244'},
 {name:'Джип',price:120,kind:'jeep',w:52,h:88,spd:0.92,hnd:1.32,c1:'#8aa054',c2:'#5d7038',win:'#2c3524'},
 {name:'Спорт',price:260,kind:'sport',w:44,h:88,spd:1.18,hnd:0.82,c1:'#e03434',c2:'#8f1d1d',win:'#1e2530'},
 {name:'Кабриолет',price:420,kind:'cabrio',w:44,h:80,spd:1.06,hnd:1.15,c1:'#3ba7d9',c2:'#1f6f9e',win:'#22303c'},
 {name:'Суперкар',price:700,kind:'super',w:46,h:90,spd:1.32,hnd:0.72,c1:'#f2a13c',c2:'#c26a12',win:'#241f16'}
];
var MAPS=[
 {name:'Город',ground:'#6f7d63',road:'#43474f',edge:'#31353c',line:'#f2f2f2',sky:'#9db9cf',night:false,decor:'city',pal:['#b23b3b','#3b6ab2','#cfcfcf','#3ba65a','#d8b23b','#8a8f98','#7b4bb2']},
 {name:'Ночь',ground:'#2c3038',road:'#2a2d34',edge:'#1e2127',line:'#cfd6e0',sky:'#0e1220',night:true,decor:'night',pal:['#b23b3b','#3b6ab2','#cfcfcf','#3ba65a','#d8b23b','#7b4bb2']},
 {name:'Пустыня',ground:'#d9b471',road:'#8f8574',edge:'#6f6656',line:'#f5eeda',sky:'#f0c98a',night:false,decor:'desert',pal:['#b23b3b','#3b6ab2','#efefef','#d8b23b','#8a8f98']},
 {name:'Зима',ground:'#e8edf2',road:'#5c6169',edge:'#474c54',line:'#f2f2f2',sky:'#c7d5e2',night:false,decor:'winter',pal:['#b23b3b','#3b6ab2','#3ba65a','#8a8f98','#7b4bb2']}
];

var state='menu',game=null,btns=[],particles=[],shake=0,crashT=0,overInfo=null;

function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,sz,col,al,b){ctx.fillStyle=col||'#fff';ctx.font=(b?'bold ':'')+sz+'px system-ui,Segoe UI,Arial';ctx.textAlign=al||'left';ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}

var AC=null,eOsc=null,eGain=null;
function initAudio(){
 if(AC){try{AC.resume();}catch(e){}return;}
 try{
  AC=new (window.AudioContext||window.webkitAudioContext)();
  eOsc=AC.createOscillator();eOsc.type='sawtooth';eOsc.frequency.value=80;
  eGain=AC.createGain();eGain.gain.value=0;
  var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=420;
  eOsc.connect(f);f.connect(eGain);eGain.connect(AC.destination);eOsc.start();
 }catch(e){AC=null;}
}
function tone(f,d,type,v,slide){if(!AC||!data.sound)return;try{var o=AC.createOscillator(),gn=AC.createGain(),t0=AC.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.linearRampToValueAtTime(slide,t0+d);gn.gain.setValueAtTime(v||0.15,t0);gn.gain.exponentialRampToValueAtTime(0.001,t0+d);o.connect(gn);gn.connect(AC.destination);o.start(t0);o.stop(t0+d+0.02);}catch(e){}}
function noiseSnd(d,v,fq){if(!AC||!data.sound)return;try{var n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),dd=b.getChannelData(0);for(var i=0;i<n;i++)dd[i]=(Math.random()*2-1)*(1-i/n);var s=AC.createBufferSource();s.buffer=b;var f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fq||900;var gn=AC.createGain();gn.gain.value=v||0.25;s.connect(f);f.connect(gn);gn.connect(AC.destination);s.start();}catch(e){}}
function sCoin(){tone(920,0.09,'square',0.12);setTimeout(function(){tone(1380,0.12,'square',0.1);},70);}
function sGem(){tone(660,0.1,'triangle',0.16);setTimeout(function(){tone(880,0.1,'triangle',0.14);},80);setTimeout(function(){tone(1320,0.16,'triangle',0.12);},160);}
function sWhoosh(){noiseSnd(0.18,0.1,700);}
function sCrash(){noiseSnd(0.5,0.5,300);tone(70,0.5,'sine',0.4,35);}
function sClick(){tone(520,0.06,'square',0.08);}
function engineUpdate(){if(!eGain||!eOsc)return;var v=0,f=80;try{if(state==='play'&&game&&data.sound){v=0.035;f=70+game.spd*0.16;if(game.brake.holding&&!game.brake.locked)f*=0.7;}eGain.gain.value=v;eOsc.frequency.value=f;}catch(e){}}

function roadMetrics(){var rw=Math.min(W*0.86,470);var lanes=4;var lx=(W-rw)/2;return{rw:rw,lanes:lanes,lw:rw/lanes,lx:lx};}
function laneX(l){var r=roadMetrics();return r.lx+r.lw*(l+0.5);}

function newDecor(y){
 var m=MAPS[data.map],kind='tree';
 if(m.decor==='city')kind=Math.random()<0.6?'building':'tree';
 else if(m.decor==='night')kind=Math.random()<0.5?'building':(Math.random()<0.5?'lamp':'tree');
 else if(m.decor==='desert')kind=Math.random()<0.5?'cactus':'rock';
 else kind=Math.random()<0.7?'pine':'rock';
 return{y:y,side:Math.random()<0.5?-1:1,kind:kind,seed:Math.floor(Math.random()*100000),s:0.8+Math.random()*0.6};
}
function startRun(){
 particles=[];
 var car=CARS[data.sel];
 game={car:car,lane:1,px:0,py:0,spd:0,brake:{charge:1,holding:false,locked:false},
  traffic:[],coins:[],dist:0,meters:0,tSpawn:1.2,tCoin:1.0,tGem:5,
  decor:[],snow:[],dash:0,runCoins:0,newBest:false,time:0,tilt:0};
 for(var i=0;i<16;i++)game.decor.push(newDecor(-Math.random()*H*1.2));
 for(var i2=0;i2<70;i2++)game.snow.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.2,v:30+Math.random()*60,ph:Math.random()*6.28});
 game.px=laneX(game.lane);game.py=H*0.78;
}
function spawnTraffic(){
 var g=game,r=roadMetrics(),free=[];
 for(var l=0;l<r.lanes;l++){
  var blocked=false;
  for(var i=0;i<g.traffic.length;i++){var c=g.traffic[i];if(c.lane===l&&c.y<-60){blocked=true;break;}}
  if(!blocked)free.push(l);
 }
 if(!free.length)return;
 var lane=free[Math.floor(Math.random()*free.length)];
 var y=-190-Math.random()*170;
 var roll=Math.random(),kind='car';
 if(roll<0.14)kind='truck';else if(roll<0.26)kind='taxi';
 var m=MAPS[data.map];
 var col=kind==='taxi'?'#f2c230':m.pal[Math.floor(Math.random()*m.pal.length)];
 var base=(kind==='truck'?0.42+Math.random()*0.1:0.5+Math.random()*0.34);
 g.traffic.push({lane:lane,x:laneX(lane),y:y,w:kind==='truck'?54:46,h:kind==='truck'?132:(kind==='taxi'?82:84),
  spd:g.spd*base,base:g.spd*base,col:col,kind:kind,stuckT:0,chg:-1,blinkT:0});
}
function spawnPickup(t){
 var g=game,r=roadMetrics();
 var l=Math.floor(Math.random()*r.lanes);
 var y=-180-Math.random()*160;
 for(var i=0;i<g.traffic.length;i++){var c=g.traffic[i];if(Math.abs(c.x-laneX(l))<r.lw*0.6&&Math.abs(c.y-y)<90)return;}
 g.coins.push({x:laneX(l),y:y,type:t,ph:Math.random()*6.28});
}
function tryLaneChange(c){
 var r=roadMetrics(),g=game;
 var opts=[c.lane-1,c.lane+1].filter(function(l){return l>=0&&l<r.lanes;});
 opts.sort(function(){return Math.random()-0.5;});
 for(var k=0;k<opts.length;k++){
  var l=opts[k],blocked=false;
  for(var i=0;i<g.traffic.length;i++){
   var o=g.traffic[i];
   if(o!==c&&Math.abs(o.x-laneX(l))<r.lw*0.7&&Math.abs(o.y-c.y)<150){blocked=true;break;}
  }
  if(!blocked&&l===g.lane&&Math.abs(c.y-g.py)<190)blocked=true;
  if(!blocked){c.chg=l;c.blinkT=0;c.stuckT=0;return;}
 }
}
function updateTraffic(dt,ws){
 var g=game,r=roadMetrics();
 for(var i=0;i<g.traffic.length;i++){
  var c=g.traffic[i];
  var des=c.base,ly=-1e9,lsp=0,lh=0;
  for(var j=0;j<g.traffic.length;j++){
   if(j===i)continue;var o=g.traffic[j];
   if(Math.abs(o.x-c.x)<r.lw*0.7&&o.y<c.y&&o.y>ly){ly=o.y;lsp=o.spd;lh=o.h;}
  }
  if(ly>-1e8){
   var gap=(c.y-ly)-(c.h+lh)/2;
   if(gap<140)des=Math.min(des,Math.max(lsp*0.92,lsp-(140-gap)*2));
   if(gap<24)des=Math.min(des,lsp*0.9);
  }
  if(c.y>g.py){
   var gp=(c.y-g.py)-(c.h+g.car.h)/2;
   if(gp<160&&c.spd>g.spd)des=Math.min(des,g.spd*0.97);
  }
  c.spd+=(des-c.spd)*Math.min(1,dt*2.6);
  var stuck=c.spd<c.base*0.55;
  c.stuckT=stuck?c.stuckT+dt:0;
  if(c.stuckT>1.6&&c.chg<0)tryLaneChange(c);
  if(c.chg>=0){
   c.blinkT+=dt;
   var tx=laneX(c.chg);
   c.x+=(tx-c.x)*Math.min(1,dt*3.5);
   if(Math.abs(tx-c.x)<2){c.lane=c.chg;c.chg=-1;c.blinkT=0;}
  }
  c.y+=(g.spd-c.spd)*dt;
 }
 for(var a=0;a<g.traffic.length;a++){
  for(var b2=a+1;b2<g.traffic.length;b2++){
   var p1=g.traffic[a],p2=g.traffic[b2];
   if(Math.abs(p1.x-p2.x)>r.lw*0.6)continue;
   var front=p1.y<p2.y?p1:p2, rear=p1.y<p2.y?p2:p1;
   var need=(front.h+rear.h)/2+4;
   if(front.y+need>rear.y){rear.y=front.y+need;rear.spd=Math.min(rear.spd,front.spd*0.95);}
  }
 }
 for(var k=g.traffic.length-1;k>=0;k--)if(g.traffic[k].y>H+200)g.traffic.splice(k,1);
}
function hitPlayer(){
 var g=game;
 for(var i=0;i<g.traffic.length;i++){
  var c=g.traffic[i];
  if(Math.abs(c.x-g.px)<(c.w+g.car.w)/2-7&&Math.abs(c.y-g.py)<(c.h+g.car.h)/2-9)return c;
 }
 return null;
}
function doCrash(){
 var g=game;
 state='crash';crashT=0;shake=1;sCrash();
 if(TG&&TG.hapticFeedback&&TG.hapticFeedback.impactOccurred){try{TG.hapticFeedback.impactOccurred('heavy');}catch(e){}}
 for(var i=0;i<46;i++){
  var a=Math.random()*6.28,sp=60+Math.random()*260;
  particles.push({x:g.px,y:g.py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:0.5+Math.random()*0.7,
   col:['#ffb347','#ff6b35','#d43a2e','#ffe9a8','#8a8f98'][Math.floor(Math.random()*5)],r:2+Math.random()*4});
 }
 if(eGain){try{eGain.gain.value=0;}catch(e){}}
}
function finishRun(){
 var g=game;
 data.coins+=g.runCoins;
 saveNow();
 overInfo={m:Math.round(g.meters),c:g.runCoins,nb:g.newBest};
 state='over';
}
function updateParts(dt){
 for(var i=particles.length-1;i>=0;i--){
  var p=particles[i];p.life-=dt;
  if(p.life<=0){particles.splice(i,1);continue;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt;
 }
}
function update(dt){
 if(state==='play'){
  var g=game,car=g.car;
  g.time+=dt;
  var maxSpd=(340+Math.min(430,g.meters*0.215))*car.spd;
  var b=g.brake;
  if(b.holding&&!b.locked){b.charge-=dt/5;if(b.charge<=0){b.charge=0;b.locked=true;b.holding=false;}}
  else{b.charge=Math.min(1,b.charge+dt/10);if(b.locked&&b.charge>=0.2)b.locked=false;}
  var target=(b.holding&&!b.locked)?Math.max(150,maxSpd*0.42):maxSpd;
  g.spd+=(target-g.spd)*Math.min(1,dt*(target<g.spd?3.0:2.4));
  var ws=g.spd;
  g.dist+=ws*dt;g.meters=g.dist/55;
  if(g.meters>data.best){data.best=Math.round(g.meters);g.newBest=true;saveSoon();}
  var tx=laneX(g.lane);
  g.px+=(tx-g.px)*Math.min(1,dt*9*car.hnd);
  g.tilt=(tx-g.px)*0.0035;
  g.dash=(g.dash+ws*dt)%60;
  for(var i=0;i<g.decor.length;i++){var d0=g.decor[i];d0.y+=ws*dt;if(d0.y>H+140)g.decor[i]=newDecor(-140-Math.random()*H*0.8);}
  g.tSpawn-=dt;
  if(g.tSpawn<=0){g.tSpawn=Math.max(0.55,1.55-g.meters/1400)+Math.random()*0.3;spawnTraffic();}
  g.tCoin-=dt;if(g.tCoin<=0){g.tCoin=1.1+Math.random()*1.3;spawnPickup('coin');}
  g.tGem-=dt;if(g.tGem<=0){g.tGem=7+Math.random()*6;spawnPickup('gem');}
  updateTraffic(dt,ws);
  for(var k=g.coins.length-1;k>=0;k--){
   var p=g.coins[k];p.y+=ws*dt;
   if(p.y>H+40){g.coins.splice(k,1);continue;}
   if(Math.abs(p.x-g.px)<g.car.w/2+16&&Math.abs(p.y-g.py)<g.car.h/2+16){
    var v=p.type==='gem'?5:1;g.runCoins+=v;
    if(p.type==='gem')sGem();else sCoin();
    for(var q=0;q<8;q++)particles.push({x:p.x,y:p.y,vx:(Math.random()-0.5)*120,vy:-Math.random()*120,life:0.4,col:p.type==='gem'?'#4fc3f7':'#f5c445',r:2.5});
    g.coins.splice(k,1);saveSoon();
   }
  }
  if(MAPS[data.map].decor==='winter'){
   for(var s2=0;s2<g.snow.length;s2++){
    var sn=g.snow[s2];sn.y+=(sn.v+ws*0.15)*dt;sn.x+=Math.sin(g.time*2+sn.ph)*20*dt;
    if(sn.y>H+10){sn.y=-10;sn.x=Math.random()*W;}
   }
  }
  if(hitPlayer())doCrash();
 }else if(state==='crash'){
  crashT+=dt;shake=Math.max(0,shake-0.02);
  if(crashT>1.25)finishRun();
 }
 updateParts(dt);
}

function drawCar(x,y,w,h,c1,c2,win,opt){
 opt=opt||{};
 ctx.save();ctx.translate(x,y);if(opt.tilt)ctx.rotate(opt.tilt);
 ctx.fillStyle='rgba(0,0,0,0.30)';rr(-w/2+1,-h/2+5,w,h,10);ctx.fill();
 ctx.fillStyle='#14161a';
 var wy=[-h*0.30,h*0.14];
 for(var i=0;i<2;i++)for(var s=-1;s<=1;s+=2){rr(s<0?-w/2-2:w/2-4.5,wy[i],6.5,15,3);ctx.fill();}
 var g=ctx.createLinearGradient(-w/2,0,w/2,0);
 g.addColorStop(0,c2);g.addColorStop(0.3,c1);g.addColorStop(0.62,c1);g.addColorStop(1,c2);
 ctx.fillStyle=g;rr(-w/2,-h/2,w,h,Math.min(10,w*0.22));ctx.fill();
 ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=1.5;rr(-w/2,-h/2,w,h,Math.min(10,w*0.22));ctx.stroke();
 var kind=opt.kind||'car';
 if(kind==='truck'){
  ctx.fillStyle=c1;rr(-w/2,-h/2,w,h*0.30,8);ctx.fill();
  ctx.fillStyle=win;rr(-w/2+5,-h/2+6,w-10,h*0.14,4);ctx.fill();
  ctx.fillStyle='#e8eaee';rr(-w/2+3,-h/2+h*0.32,w-6,h*0.62,4);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.3)';rr(-w/2+3,-h/2+h*0.32,w-6,h*0.62,4);ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.beginPath();ctx.moveTo(-w/2+3,0);ctx.lineTo(w/2-3,0);ctx.stroke();
 }else if(kind==='cabrio'){
  ctx.fillStyle='#22262e';rr(-w/2+5,-h*0.14,w-10,h*0.40,6);ctx.fill();
  ctx.fillStyle='#3a4150';rr(-w/2+8,-h*0.10,(w-16)/2-3,h*0.26,4);ctx.fill();rr(3,-h*0.10,(w-16)/2-3,h*0.26,4);ctx.fill();
  ctx.fillStyle='rgba(150,190,220,0.85)';rr(-w/2+6,-h*0.26,w-12,h*0.14,4);ctx.fill();
 }else{
  ctx.fillStyle=win;rr(-w/2+5,-h*0.16,w-10,h*0.36,6);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.18)';rr(-w/2+7,-h*0.14,(w-14)*0.35,h*0.30,4);ctx.fill();
  ctx.fillStyle='rgba(160,200,230,0.75)';rr(-w/2+7,-h*0.30,w-14,h*0.13,4);ctx.fill();
  ctx.fillStyle='rgba(160,200,230,0.6)';rr(-w/2+8,h*0.20,w-16,h*0.11,4);ctx.fill();
  if(kind==='sport'||kind==='super'){ctx.fillStyle='rgba(255,255,255,0.75)';ctx.fillRect(-w*0.10,-h/2+2,w*0.075,h-4);ctx.fillRect(w*0.025,-h/2+2,w*0.075,h-4);}
  if(kind==='jeep'){ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=2;rr(-w/2+7,-h*0.12,w-14,h*0.28,3);ctx.stroke();}
  if(kind==='super'){ctx.fillStyle='rgba(0,0,0,0.55)';rr(-w/2+4,h/2-6,w-8,5,2);ctx.fill();}
  if(kind==='taxi'){ctx.fillStyle='#22262e';rr(-7,-h*0.02,14,8,2);ctx.fill();ctx.fillStyle='#f8e08e';rr(-5,0,10,4,1);ctx.fill();}
 }
 ctx.fillStyle=c2;rr(-w/2-4,-h*0.16,4,8,1.5);ctx.fill();rr(w/2,-h*0.16,4,8,1.5);ctx.fill();

function loop(t){
 var dt=Math.min(0.05,(t-last)/1000);last=t;
 update(dt);draw();engineUpdate();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
