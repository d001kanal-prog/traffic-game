<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Поток</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0b0d12;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;display:block}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,10,16,.72);backdrop-filter:blur(6px);z-index:10}
.panel{background:linear-gradient(160deg,rgba(32,36,52,.96),rgba(15,17,26,.98));border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:24px 20px;width:min(92vw,390px);max-height:88vh;overflow:auto;text-align:center;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.6)}
h1{font-size:36px;letter-spacing:3px;background:linear-gradient(90deg,#ffd54a,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:#9aa4b5;font-size:13px;margin:4px 0 18px}
.btn{display:block;width:100%;padding:14px;margin:8px 0;border:none;border-radius:14px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,#2f7df6,#6a4df0);cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.08)}
.btn.gold{background:linear-gradient(135deg,#ffb347,#ff8a3d)}
.row{display:flex;gap:8px}.row .btn{margin:8px 0}
.car-card{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border:2px solid transparent;border-radius:16px;padding:10px;margin:8px 0;text-align:left;cursor:pointer}
.car-card.sel{border-color:#ffd54a;background:rgba(255,213,74,.08)}
.car-card canvas{flex:0 0 auto;border-radius:10px;background:rgba(0,0,0,.25)}
.cc-info{flex:1;min-width:0}
.cc-name{font-weight:800;font-size:16px}
.cc-bar{display:flex;align-items:center;gap:6px;font-size:11px;color:#9aa4b5;margin-top:3px}
.cc-bar span{width:34px}
.cc-track{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12)}
.cc-fill{height:6px;border-radius:3px}
.cc-btn{margin-top:6px;padding:8px 14px;border:none;border-radius:10px;font-size:13px;font-weight:700;color:#fff;background:#2f7df6;cursor:pointer}
.cc-btn.owned{background:#2fae5e}.cc-btn.na{background:#4a4f5e}
.map-card{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border-radius:16px;margin:8px 0;font-weight:800;color:#fff;border:2px solid transparent;cursor:pointer}
.map-card.sel{border-color:#ffd54a}
.stat{display:flex;justify-content:space-between;font-size:15px;color:#cdd5e0;margin:6px 0}
#errbox{display:none;position:fixed;left:0;right:0;bottom:0;background:#a00;color:#fff;padding:10px;font-size:12px;z-index:99;white-space:pre-wrap}
.chip{display:inline-block;background:rgba(0,0,0,.3);border-radius:20px;padding:6px 14px;font-weight:700;font-size:15px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="errbox"></div>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>ПОТОК</h1>
    <div class="sub">уворачивайся · тормози вовремя · собирай монеты</div>
    <button class="btn" id="btnPlay">ИГРАТЬ</button>
    <div class="row">
      <button class="btn ghost" id="btnGarage">Гараж</button>
      <button class="btn ghost" id="btnMaps">Трассы</button>
      <button class="btn ghost" id="btnSound">🔊</button>
    </div>
    <div class="sub" id="menuBest" style="margin-top:14px">Рекорд: 0 м</div>
    <div class="chip" id="menuCoins">🪙 0</div>
    <div class="sub" style="margin-top:14px;font-size:12px">тап слева/справа — перестроение<br>кнопка внизу — тормоз (5 сек, заряд 10 сек)</div>
  </div>
</div>

<div class="overlay" id="garage" style="display:none">
  <div class="panel">
    <div class="chip" id="garCoins">🪙 0</div>
    <div id="carList"></div>
    <button class="btn ghost" id="garBack">Назад</button>
  </div>
</div>

<div class="overlay" id="maps" style="display:none">
  <div class="panel">
    <div class="cc-name" style="margin-bottom:10px">Выбери трассу</div>
    <div id="mapList"></div>
    <button class="btn ghost" id="mapBack">Назад</button>
  </div>
</div>

<div class="overlay" id="over" style="display:none">
  <div class="panel">
    <div class="cc-name" style="font-size:26px">Авария!</div>
    <div class="stat"><span>Пройдено</span><b id="finalMeters">0</b></div>
    <div class="stat"><span>Собрано монет</span><b id="finalCoins">+0</b></div>
    <div class="stat"><span>Рекорд</span><b id="bestTxt">0</b></div>
    <button class="btn gold" id="btnAgain">Ещё раз</button>
    <button class="btn ghost" id="btnMenu">В меню</button>
  </div>
</div>

<div class="overlay" id="pause" style="display:none">
  <div class="panel">
    <div class="cc-name" style="font-size:24px">Пауза</div>
    <button class="btn" id="btnResume">Продолжить</button>
  </div>
</div>

<script>
'use strict';
window.onerror=function(msg,src,line){var d=document.getElementById('errbox');d.style.display='block';d.textContent='Ошибка: '+msg+' (строка '+line+')';};

function $(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rand(a,b){return a+Math.random()*(b-a);}
function irand(a,b){return Math.floor(a+Math.random()*(b-a+1));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shade(hex,amt){var n=parseInt(hex.slice(1),16);var r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);return 'rgb('+r+','+g+','+b+')';}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

// ---------- storage ----------
var memStore={};
function sGet(k){try{return localStorage.getItem(k);}catch(e){return memStore[k]||null;}}
function sSet(k,v){try{localStorage.setItem(k,v);}catch(e){memStore[k]=v;}}

// ---------- telegram ----------
var tg=null;
try{if(window.Telegram&&window.Telegram.WebApp)tg=window.Telegram.WebApp;}catch(e){}
var cloud=(tg&&tg.CloudStorage)?tg.CloudStorage:null;
try{if(tg){tg.ready();tg.expand();if(tg.requestFullscreen)tg.requestFullscreen();}}catch(e){}
function haptic(kind){try{if(tg&&tg.HapticFeedback){tg.HapticFeedback.impactOccurred(kind==='heavy'?'heavy':'light');}}catch(e){}}

// ---------- save ----------
var SAVE_KEY='traffic_save_v3';
var save={coins:0,owned:['city'],car:'city',best:0,map:'city',sound:true};
var saveTimer=null;
function cloudGet(key,cb){if(!cloud){cb(null);return;}try{cloud.getItem(key,function(e,v){cb(e?null:v);});}catch(e){cb(null);}}
function cloudSet(key,val){if(!cloud)return;try{cloud.setItem(key,val,function(){});}catch(e){}}
function persist(){var s=JSON.stringify(save);sSet(SAVE_KEY,s);if(saveTimer)clearTimeout(saveTimer);saveTimer=setTimeout(function(){cloudSet(SAVE_KEY,s);},900);}
function applyCloud(str){if(!str)return;try{var cs=JSON.parse(str);if((cs.coins||0)>save.coins)save.coins=cs.coins;if((cs.best||0)>save.best)save.best=cs.best;if(cs.owned&&cs.owned.length>save.owned.length)save.owned=cs.owned;if(cs.car)save.car=cs.car;if(cs.map)save.map=cs.map;if(cs.sound!==undefined)save.sound=cs.sound;refreshHUD();syncGarage();syncMaps();}catch(e){}}
function loadAll(){try{var raw=sGet(SAVE_KEY);if(raw){var ls=JSON.parse(raw);for(var k in ls)save[k]=ls[k];}}catch(e){}refreshHUD();syncGarage();syncMaps();cloudGet(SAVE_KEY,applyCloud);}

// ---------- data ----------
var CARS=[
 {id:'city',name:'Сити',price:0,color:'#4a9eff',speed:300,handle:1.0,w:50,h:96,desc:'Надёжный седан'},
 {id:'jeep',name:'Джип',price:120,color:'#7d9469',speed:285,handle:1.5,w:62,h:104,desc:'Широкий, но очень цепкий'},
 {id:'sport',name:'Спорт',price:300,color:'#e74c3c',speed:385,handle:0.85,w:52,h:100,desc:'Быстрый, но резкий'},
 {id:'cabrio',name:'Кабриолет',price:600,color:'#f39c12',speed:335,handle:1.25,w:50,h:94,desc:'Лёгкий и юркий'},
 {id:'super',name:'Суперкар',price:1200,color:'#9b59b6',speed:440,handle:0.72,w:54,h:104,desc:'Молния с норовом'}
];
var CAR_MAP={};CARS.forEach(function(c){CAR_MAP[c.id]=c;});
var MAPS={
 city:{name:'Город',ground:'#4a7c4e',road:'#3a3f47',roadEdge:'#2b2f36',decor:'buildings',night:false,snow:false,grad:'#8fc0e8',
   trafficColors:['#d94f4f','#4f7fd9','#e0e0e0','#3fae6a','#e08a2e','#8a5fd0','#c9c9c9']},
 night:{name:'Ночь',ground:'#1b2030',road:'#23262e',roadEdge:'#15181f',decor:'buildings',night:true,snow:false,
   trafficColors:['#5f6d85','#7a4f8f','#4f6f9f','#6d5f8f','#9f4f5f','#5f8f7f']},
 desert:{name:'Пустыня',ground:'#d9b977',road:'#4b4a45',roadEdge:'#3a3934',decor:'cacti',night:false,snow:false,
   trafficColors:['#d94f4f','#4f7fd9','#e08a2e','#8a5f3f','#c9c9c9','#3fae6a']},
 winter:{name:'Зима',ground:'#e6edf2',road:'#54575c',roadEdge:'#3d4046',decor:'trees',night:false,snow:true,
   trafficColors:['#d94f4f','#4f7fd9','#2f6f4f','#e08a2e','#8a5fd0','#c9c9c9']}
};

// ---------- audio ----------
var AU={ctx:null,master:null,eng:null,engGain:null,noiseBuf:null,screechGain:null,
 init:function(){if(this.ctx)return;try{
  var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=save.sound?0.5:0;this.master.connect(this.ctx.destination);
  this.eng=this.ctx.createOscillator();this.eng.type='sawtooth';this.eng.frequency.value=60;
  this.engGain=this.ctx.createGain();this.engGain.gain.value=0;
  var lp=this.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;
  this.eng.connect(lp);lp.connect(this.engGain);this.engGain.connect(this.master);this.eng.start();
  var len=this.ctx.sampleRate;this.noiseBuf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
  var d=this.noiseBuf.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
  var src=this.ctx.createBufferSource();src.buffer=this.noiseBuf;src.loop=true;
  var bp=this.ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500;bp.Q.value=5;
  this.screechGain=this.ctx.createGain();this.screechGain.gain.value=0;
  src.connect(bp);bp.connect(this.screechGain);this.screechGain.connect(this.master);src.start();
 }catch(e){}},
 resume:function(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
 setSound:function(on){if(this.master)this.master.gain.value=on?0.5:0;},
 engine:function(s01,braking){if(!this.ctx)return;if(this.eng){this.eng.frequency.value=52+s01*165;this.engGain.gain.value=0.045+s01*0.09;}if(this.screechGain)this.screechGain.gain.value=braking?0.12:0;},
 blip:function(freq,dur,type,vol){try{if(!this.ctx)return;var o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type||'sine';o.frequency.value=freq;g.gain.value=vol||0.2;g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+dur);o.connect(g);g.connect(this.master);o.start();o.stop(this.ctx.currentTime+dur);}catch(e){}},
 coin:function(){this.blip(880,0.08,'square',0.12);var s=this;setTimeout(function(){s.blip(1320,0.1,'square',0.12);},60);},
 gem:function(){var s=this,f=660;for(var i=0;i<3;i++){(function(ff,ii){setTimeout(function(){s.blip(ff,0.12,'triangle',0.14);},ii*70);})(f,i);f*=1.26;}},
 whoosh:function(){try{if(!this.ctx)return;var s=this.ctx.createBufferSource();s.buffer=this.noiseBuf;var f=this.ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=650;f.Q.value=1;var g=this.ctx.createGain();g.gain.value=0.14;g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+0.22);s.connect(f);f.connect(g);g.connect(this.master);s.start();s.stop(this.ctx.currentTime+0.26);}catch(e){}},
 crash:function(){try{if(!this.ctx)return;var s=this.ctx.createBufferSource();s.buffer=this.noiseBuf;var f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=800;var g=this.ctx.createGain();g.gain.value=0.5;g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+0.5);s.connect(f);f.connect(g);g.connect(this.master);s.start();s.stop(this.ctx.currentTime+0.55);this.blip(80,0.4,'sawtooth',0.3);}catch(e){}},
 click:function(){this.blip(520,0.05,'square',0.08);}
};

// ---------- canvas ----------
var cv=$('game'),ctx=cv.getContext('2d');
var W=0,H=0,roadW=0,roadX=0,laneW=0;
function resize(){var DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);roadW=Math.min(W*0.94,440);roadX=(W-roadW)/2;laneW=roadW/4;}
window.addEventListener('resize',function(){resize();});resize();
function laneCenter(i){return roadX+laneW*(i+0.5);}

// ---------- state ----------
var state='menu';
var traffic=[],pickups=[],particles=[],decor=[],snowDrops=[];
var player={lane:1,x:0,y:0,w:50,h:96,color:'#4a9eff',speed:0,maxSpeed:300,tilt:0,braking:false};
var brake={charge:1,locked:false,hold:false};
var dist=0,runCoins=0,shake=0,flash=0,spawnT=0,coinT=0,world=0,worldT=0,scrollY=0,lastT=0,dtG=0.016;

function decorX(side){if(side===0)return rand(16,Math.max(20,roadX-38));return rand(roadX+roadW+38,Math.max(roadX+roadW+42,W-16));}
function genDecor(){decor.length=0;for(var i=0;i<12;i++){var side=i%2;decor.push({side:side,x:decorX(side),y:rand(-H,H),s:rand(26,54),c1:pick(['#3a5f3a','#4a6f4a','#5a4f3f','#6f5f4f','#3f4f6f']),win:[irand(0,1),irand(0,1),irand(0,1),irand(0,1),irand(0,1),irand(0,1)]});}}
function genSnow(){snowDrops.length=0;for(var i=0;i<60;i++)snowDrops.push({x:Math.random()*W,y:Math.random()*H,r:rand(1,3),v:rand(30,80)});}

// ---------- traffic ----------
function laneFree(lane,yMin,yMax){return !traffic.some(function(t){return t.lane===lane&&t.y>yMin&&t.y<yMax;});}
function makeTraffic(lane,y){
 var type=Math.random()<0.14?'truck':(Math.random()<0.13?'taxi':'sedan');
 var w=type==='truck'?64:52,h=type==='truck'?150:96;
 var col=type==='taxi'?'#f6c531':pick(MAPS[save.map].trafficColors);
 var base=player.maxSpeed*rand(0.48,0.72);if(type==='truck')base*=0.75;
 return {lane:lane,x:laneCenter(lane),y:y,w:w,h:h,color:col,type:type,base:base,cur:base,blinker:0,blinkDir:1,blocked:0,changeT:0};
}
function spawnTraffic(){
 if(traffic.length>14)return;
 var lanes=[0,1,2,3].filter(function(l){return !traffic.some(function(t){return t.lane===l&&t.y<230;});});
 if(!lanes.length)return;
 var lane=pick(lanes);
 traffic.push(makeTraffic(lane,-170-rand(0,140)));
}
function spawnPickups(){
 var lane=irand(0,3);
 if(traffic.some(function(t){return t.lane===lane&&t.y<320;}))return;
 var type=Math.random()<0.16?'gem':'coin';
 var n=type==='coin'?irand(1,4):1;
 for(var i=0;i<n;i++)pickups.push({x:laneCenter(lane),y:-70-i*46,type:type,ph:Math.random()*6});
}

// ---------- game flow ----------
function startGame(){
 state='play';
 var car=CAR_MAP[save.car];
 player.lane=1;player.x=laneCenter(1);player.y=H-190;
 player.w=car.w;player.h=car.h;player.color=car.color;
 player.speed=car.speed*0.55;player.maxSpeed=car.speed;player.tilt=0;player.braking=false;
 brake.charge=1;brake.locked=false;brake.hold=false;
 traffic.length=0;pickups.length=0;particles.length=0;
 dist=0;runCoins=0;shake=0;flash=0;spawnT=1.4;coinT=1.6;
 for(var i=0;i<7;i++){var lane=irand(0,3),y=-320-i*rand(180,260);if(laneFree(lane,y-170,y+170))traffic.push(makeTraffic(lane,y));}
 hideOverlays();
 AU.init();AU.resume();
}
function gameOver(){
 state='over';
 AU.crash();AU.engine(0,false);haptic('heavy');shake=18;flash=1;
 for(var i=0;i<28;i++)particles.push({x:player.x,y:player.y,vx:rand(-280,280),vy:rand(-280,280),life:rand(0.4,0.95),c:pick(['#ffb347','#ff6b35','#ffe66d','#9aa4b5'])});
 if(dist>save.best)save.best=dist;
 persist();
 $('finalMeters').textContent=Math.floor(dist)+' м';
 $('finalCoins').textContent='+'+runCoins;
 $('bestTxt').textContent=Math.floor(save.best)+' м';
 refreshHUD();
 setTimeout(function(){$('over').style.display='flex';},750);
}
function hideOverlays(){['menu','garage','maps','over','pause'].forEach(function(id){$(id).style.display='none';});}
function refreshHUD(){
 $('menuCoins').textContent='🪙 '+save.coins;
 $('garCoins').textContent='🪙 '+save.coins;
 $('menuBest').textContent='Рекорд: '+Math.floor(save.best)+' м';
 $('btnSound').textContent=save.sound?'🔊':'🔇';
}

// ---------- update ----------
function update(dt){
 var car=CAR_MAP[save.car];
 if(player.braking&&brake.charge>0&&!brake.locked){
  player.speed=Math.max(player.maxSpeed*0.45,player.speed-520*dt);
  brake.charge=Math.max(0,brake.charge-dt/5);
  if(brake.charge<=0){brake.locked=true;player.braking=false;}
 }else{
  player.speed=Math.min(player.maxSpeed,player.speed+70*dt);
  brake.charge=Math.min(1,brake.charge+dt/10);
  if(brake.locked&&brake.charge>=0.2)brake.locked=false;
 }
 world=player.speed;
 dist+=world*dt/55;
 var tx=laneCenter(player.lane);
 player.x+=(tx-player.x)*Math.min(1,dt*10*car.handle);
 player.tilt=clamp((tx-player.x)*0.055,-13,13);

 spawnT-=dt;
 if(spawnT<=0){spawnT=clamp(1.5-dist/14000,0.55,1.5)*rand(0.7,1.25);spawnTraffic();}
 coinT-=dt;
 if(coinT<=0){coinT=rand(0.9,1.7);spawnPickups();}

 for(var i=traffic.length-1;i>=0;i--){
  var t=traffic[i];
  t.y+=(world-t.cur)*dt;
  var ahead=null,gap=1e9;
  for(var j=0;j<traffic.length;j++){
   var o=traffic[j];
   if(o!==t&&o.lane===t.lane&&o.y<t.y){var g=t.y-o.y-(t.h+o.h)/2;if(g<gap){gap=g;ahead=o;}}
  }
  if(t.lane===player.lane&&player.y<t.y){
   var gp=t.y-player.y-(t.h+player.h)/2;
   if(gp<gap){gap=gp;ahead={cur:world,h:player.h,y:player.y};}
  }
  var minGap=95;
  if(ahead){
   if(gap<minGap){t.cur=Math.max(0,Math.min(t.cur,ahead.cur));t.blocked+=dt;}
   else if(gap<minGap*1.6){t.cur=Math.max(0,Math.min(t.cur,ahead.cur+(gap-minGap)*0.8));if(gap<minGap*1.15)t.blocked+=dt;}
   else t.cur=Math.min(t.base,t.cur+130*dt);
   if(gap<minGap*0.8)t.y=Math.max(t.y,ahead.y+(t.h+ahead.h)/2);
  }else t.cur=Math.min(t.base,t.cur+130*dt);
  if(t.blocked>1.1&&t.changeT<=0){
   var dirs=t.lane===0?[1]:(t.lane===3?[-1]:[1,-1]);
   for(var di=0;di<dirs.length;di++){
    var nl=t.lane+dirs[di];
    var clear=!traffic.some(function(o2){return o2!==t&&o2.lane===nl&&Math.abs(o2.y-t.y)<175;});
    var playerNear=(nl===player.lane)&&(player.y<t.y)&&(t.y-player.y<280);
    if(clear&&!playerNear){t.lane=nl;t.changeT=0.7;t.blinker=1.3;t.blinkDir=dirs[di];t.blocked=0;break;}
   }
  }
  if(t.changeT>0)t.changeT-=dt;
  if(t.blinker>0)t.blinker-=dt;
  t.x+=(laneCenter(t.lane)-t.x)*Math.min(1,dt*6);
  if(t.y>H+200||t.y<-600)traffic.splice(i,1);
 }

 for(var i=pickups.length-1;i>=0;i--){
  var p=pickups[i];p.y+=world*dt;p.ph+=dt*4;
  var dx=p.x-player.x,dy=p.y-player.y;
  if(dx*dx+dy*dy<40*40){
   if(p.type==='gem'){save.coins+=5;runCoins+=5;AU.gem();}else{save.coins++;runCoins++;AU.coin();}
   haptic('light');persist();refreshHUD();pickups.splice(i,1);continue;
  }
  if(p.y>H+70)pickups.splice(i,1);
 }

 for(var t of traffic){
  if(Math.abs(t.x-player.x)<(t.w+player.w)/2-10&&Math.abs(t.y-player.y)<(t.h+player.h)/2-8){gameOver();return;}
 }
 AU.engine(world/player.maxSpeed,player.braking&&!brake.locked&&brake.charge>0);
 if(shake>0)shake=Math.max(0,shake-dt*40);
 if(flash>0)flash=Math.max(0,flash-dt*2);
}
function updParticles(dt){for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1);}}
function updSnow(dt){for(var s of snowDrops){s.y+=(s.v+world*0.25)*dt;s.x+=Math.sin(worldT+s.v)*8*dt;if(s.y>H+6){s.y=-6;s.x=Math.random()*W;}}}

function syncGarage(){
 $('carList').innerHTML='';
 CARS.forEach(function(c){
  var card=document.createElement('div');card.className='car-card'+(save.car===c.id?' sel':'');
  var cvp=document.createElement('canvas');cvp.width=84;cvp.height=132;cvp.style.width='84px';cvp.style.height='132px';
  var g=cvp.getContext('2d');drawCar(g,42,64,c.w,c.h,c.color,c.id,{'night':false});

  var info=document.createElement('div');info.className='cc-info';
  var spd=Math.round((c.speed-250)/(440-250)*100),hnd=Math.round((c.handle-0.6)/(1.5-0.6)*100);
  info.innerHTML='<div class="cc-name">'+c.name+'</div>'+
   '<div class="cc-bar"><span>Скор.</span><div class="cc-track"><div class="cc-fill" style="width:'+spd+'%;background:#ff8a3d"></div></div></div>'+
   '<div class="cc-bar"><span>Управл.</span><div class="cc-track"><div class="cc-fill" style="width:'+hnd+'%;background:#4caf50"></div></div></div>'+
   '<div class="cc-bar" style="color:#cdd5e0">'+c.desc+'</div>';
  var btn=document.createElement('button');btn.className='cc-btn';
  if(save.owned.indexOf(c.id)>=0){
   if(save.car===c.id){btn.classList.add('owned');btn.textContent='В пути';}
   else{btn.textContent='Выбрать';btn.addEventListener('click',function(ev){ev.stopPropagation();save.car=c.id;persist();AU.click();syncGarage();});}
  }else{
   if(save.coins>=c.price){btn.textContent='Купить · 🪙 '+c.price;btn.addEventListener('click',function(ev){ev.stopPropagation();save.coins-=c.price;save.owned.push(c.id);save.car=c.id;persist();AU.coin();haptic('light');syncGarage();refreshHUD();});}
   else{btn.classList.add('na');btn.textContent='Нужно 🪙 '+c.price;}
  }
  info.appendChild(btn);
  card.appendChild(info);
  card.addEventListener('click',function(){if(save.owned.indexOf(c.id)>=0){save.car=c.id;persist();syncGarage();}});

 });

}

// ---------- loop ----------
function loop(ts){
 requestAnimationFrame(loop);
 var dt=Math.min(0.05,(ts-lastT)/1000||0.016);lastT=ts;worldT+=dt;dtG=dt;
 if(state==='play')update(dt);
 var spd=(state==='play')?world:(state==='over'?0:150);
 scrollY+=spd*dt;
 for(var i=0;i<decor.length;i++){var d=decor[i];d.y+=spd*dt;if(d.y>H+180){d.y=-rand(80,420);d.x=decorX(d.side);}}
 updParticles(dt);updSnow(dt);
 if(state!=='play')AU.engine(0,false);
 render();
}
genDecor();genSnow();resize();
loadAll();
$('menu').style.display='flex';
requestAnimationFrame(loop);
</script>
</body>
